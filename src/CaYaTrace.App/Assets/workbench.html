<!DOCTYPE html>
<!--
  The CaYaTrace workbench.

  This single file serves two purposes on purpose. Inside the app it is loaded by
  WebView2 and talks to the engine over the host bridge. Exported, the same file is
  written with the session data inlined into window.__CAYATRACE_DATA__ and opens in
  any browser with no tool, no server, and no network.

  Keeping them the same file means the report a colleague opens is literally the view
  the analyst was looking at, rather than a second renderer that drifts from the first.
  Sections that need an engine behind them are marked .live-only and are removed from
  the exported copy at boot.
-->
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaYaTrace</title>
<style>/*__THEME_CSS__*/</style>
</head>

<script>
"use strict";

/* ============================================================== i18n */

const CATALOGUE = (() => {
  try { return JSON.parse(document.getElementById('i18n').textContent) || {}; }
  catch (e) { return {}; }
})();

let LANG = 'en';

/* English is the fallback for every key, and the key itself is the last resort. A
   stray identifier in a sentence tells a reader nothing; the English sentence does. */
function t(key, ...args) {
  const table = CATALOGUE[LANG] || {};
  const fallback = CATALOGUE.en || {};
  let text = table[key] ?? fallback[key] ?? key;
  args.forEach((v, i) => { text = text.split('{' + i + '}').join(String(v)); });
  return text;
}

function applyLanguage() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  renderNav();
  renderLangSwitch();
  renderAll();
}

/* ============================================================== state */

const CATEGORY_COLORS = {
  Process: 'var(--cat-process)', Module: 'var(--cat-module)', File: 'var(--cat-file)',
  Registry: 'var(--cat-registry)', Service: 'var(--cat-service)', ScheduledTask: 'var(--cat-task)',
  Autorun: 'var(--cat-autorun)', Network: 'var(--cat-network)', Dns: 'var(--cat-dns)',
  Tls: 'var(--cat-tls)', Http: 'var(--cat-http)', Security: 'var(--cat-security)',
  Driver: 'var(--cat-driver)', Firewall: 'var(--cat-security)', Wmi: 'var(--cat-registry)',
};

const RISK_ORDER = ['Critical', 'High', 'Medium', 'Low', 'Info'];

const state = {
  view: 'overview',
  pinnedView: false,
  host: { elevated: false, version: '', sessionRoot: '', languages: ['en'], ollama: '', fleetPort: 47921 },

  session: null,
  counts: {},
  findings: [],
  roots: [],
  network: { requests: [], flows: [], dns: [], tls: [] },
  processes: [],

  hidden: new Set(),
  query: '',
  treeQuery: '',
  showReads: false,
  selected: null,
  expanded: new Set(),

  capture: { state: 'idle', events: 0, elapsed: 0, mode: 'launch' },
  sessions: [],
  networkTab: 'requests',

  ai: { status: null, models: [], assessments: [], report: null, busy: false, progress: null },
  compare: { inputs: [], result: null },
  plan: null,
  fleet: null,
};

/* ============================================================ transport */

/* Inside the app the engine injects results through the WebView2 bridge; exported,
   the data is already in the page. Detecting which lets one file do both. */
const bridge = {
  live: typeof window.chrome !== 'undefined' && !!window.chrome.webview,
  handlers: {},

  send(type, payload) {
    if (this.live) window.chrome.webview.postMessage(JSON.stringify({ type, payload: payload || {} }));
  },

  on(type, fn) { this.handlers[type] = fn; },

  receive(msg) {
    const fn = this.handlers[msg.type];
    if (fn) fn(msg.payload || {});
  },
};

/* ============================================================== helpers */

const p = (o, name) => o?.[name] ?? o?.[name.charAt(0).toLowerCase() + name.slice(1)];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function formatBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1).replace(/\.0$/, '') + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1).replace(/\.0$/, '') + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

function formatNumber(n) { return Number(n || 0).toLocaleString(LANG === 'tr' ? 'tr-TR' : 'en-US'); }

/* "1.2.3.4:443" and "[::1]:443" both lose the port; a bare address keeps it all. */
function stripPort(endpoint) {
  const s = String(endpoint || '');
  const bracket = s.lastIndexOf(']');
  if (bracket > 0) return s.slice(0, bracket + 1);
  const colon = s.lastIndexOf(':');
  return colon > 0 ? s.slice(0, colon) : s;
}

function formatTime(value) {
  if (!value) return '';
  const d = new Date(value);
  return isNaN(d) ? String(value) : d.toLocaleTimeString(LANG === 'tr' ? 'tr-TR' : 'en-US');
}

function formatDateTime(value) {
  if (!value) return '';
  const d = new Date(value);
  return isNaN(d) ? String(value) : d.toLocaleString(LANG === 'tr' ? 'tr-TR' : 'en-US');
}

function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h > 0 ? String(h).padStart(2, '0') + ':' : '') +
         String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function toast(text, kind) {
  const host = document.getElementById('toasts');
  const node = el('div', 'toast' + (kind ? ' ' + kind : ''), text);
  host.appendChild(node);
  setTimeout(() => node.remove(), kind === 'error' ? 9000 : 5000);
}

/* A modal rather than window.confirm: the native dialog cannot carry the explanation
   of what is about to change, and this one is also the place a typed confirmation
   lives for the actions that need one. */
function showModal({ title, body, extra, actions }) {
  const host = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = title || '';
  document.getElementById('modalBody').textContent = body || '';

  const extraHost = document.getElementById('modalExtra');
  extraHost.innerHTML = '';
  if (extra) extraHost.appendChild(extra);

  const actionHost = document.getElementById('modalActions');
  actionHost.innerHTML = '';
  (actions || []).forEach(a => {
    const b = el('button', 'btn ' + (a.className || 'btn-ghost'), a.label);
    b.type = 'button';
    b.onclick = () => { if (a.onClick && a.onClick() === false) return; closeModal(); };
    if (a.id) b.id = a.id;
    actionHost.appendChild(b);
  });

  host.hidden = false;
}

function closeModal() { document.getElementById('modal').hidden = true; }

function table(columns, rows, renderRow) {
  const wrap = el('div', 'table-wrap');
  const tbl = el('table', 'data');

  const head = document.createElement('thead');
  const hr = document.createElement('tr');
  columns.forEach(c => hr.appendChild(el('th', null, c)));
  head.appendChild(hr);
  tbl.appendChild(head);

  const body = document.createElement('tbody');
  rows.forEach(r => body.appendChild(renderRow(r)));
  tbl.appendChild(body);

  wrap.appendChild(tbl);
  return wrap;
}

function cell(text, className) { return el('td', className, text); }

function emptyState(message) {
  const host = el('div', 'empty');
  host.appendChild(el('div', null, message));
  return host;
}

/* ============================================================ navigation */

const NAV = [
  { id: 'overview',  key: 'nav.overview',  live: false, icon: 'M4 5h16M4 12h10M4 19h7' },
  { id: 'capture',   key: 'nav.capture',   live: true,  icon: 'M12 4v16M4 12h16' },
  { id: 'sessions',  key: 'nav.sessions',  live: true,  icon: 'M4 6h16M4 12h16M4 18h16' },
  { id: 'findings',  key: 'nav.findings',  live: false, icon: 'M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z' },
  { id: 'tree',      key: 'nav.tree',      live: false, icon: 'M12 4v6M6 20v-4M18 20v-4M6 16h12v-6' },
  { id: 'network',   key: 'nav.network',   live: false, icon: 'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3.5 3 13.5 0 18' },
  { id: 'compare',   key: 'nav.compare',   live: true,  icon: 'M9 4v16M15 4v16M4 9h10M10 15h10' },
  { id: 'assistant', key: 'nav.assistant', live: true,  icon: 'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z' },
  { id: 'remediate', key: 'nav.remediate', live: true,  icon: 'M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13' },
  { id: 'fleet',     key: 'nav.fleet',     live: true,  icon: 'M4 8h6V4H4zM14 8h6V4h-6zM9 20h6v-4H9zM7 8v4h10V8M12 12v4' },
];

function renderNav() {
  const host = document.getElementById('nav');
  host.innerHTML = '';

  NAV.forEach(item => {
    if (item.live && !bridge.live) return;

    const b = el('button');
    b.type = 'button';
    b.dataset.view = item.id;
    b.setAttribute('aria-current', String(state.view === item.id));

    b.innerHTML =
      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${item.icon}"/></svg>` +
      `<span>${esc(t(item.key))}</span>`;

    const count = navCount(item.id);
    if (count) b.appendChild(el('span', 'nav-count', count));

    b.disabled = needsSession(item.id) && !state.session;
    b.onclick = () => setView(item.id);
    host.appendChild(b);
  });
}

function needsSession(id) {
  return ['overview', 'findings', 'tree', 'network', 'remediate'].includes(id);
}

function navCount(id) {
  if (id === 'findings' && state.findings.length) return formatNumber(state.findings.length);
  if (id === 'network') {
    const n = state.network.requests.length + state.network.flows.length;
    return n ? formatNumber(n) : '';
  }
  if (id === 'sessions' && state.sessions.length) return formatNumber(state.sessions.length);
  return '';
}

function setView(view) {
  state.view = view;
  NAV.forEach(item => {
    const section = document.getElementById('view-' + item.id);
    if (section) section.hidden = item.id !== view;
  });
  document.querySelectorAll('#nav button').forEach(b => {
    b.setAttribute('aria-current', String(b.dataset.view === view));
  });

  const item = NAV.find(n => n.id === view);
  document.getElementById('viewTitle').textContent = item ? t(item.key) : 'CaYaTrace';

  // Views that fetch on demand rather than on load: a session list or a model probe
  // is stale by the time it is looked at otherwise.
  if (view === 'sessions') requestSessions();
  if (view === 'assistant' && !state.ai.status) requestAiStatus();
  if (view === 'fleet' && !state.fleet) bridge.send('fleetState', {});
}

function renderLangSwitch() {
  const host = document.getElementById('langSwitch');
  host.innerHTML = '';

  // Taken from the catalogue rather than from the host, so an exported report — which
  // never receives a boot message — still offers both languages. The report is written
  // in the operator's language and read by whoever it was sent to.
  const available = Object.keys(CATALOGUE)
    .filter(code => !code.startsWith('_'))
    .sort((a, b) => (a === 'en' ? -1 : b === 'en' ? 1 : a.localeCompare(b)));

  (available.length ? available : ['en']).forEach(code => {
    const b = el('button', null, code.toUpperCase());
    b.type = 'button';
    b.setAttribute('aria-pressed', String(code === LANG));
    b.onclick = () => {
      LANG = code;
      bridge.send('setLanguage', { language: code });
      applyLanguage();
    };
    host.appendChild(b);
  });
}

/* ============================================================== banners */

function renderBanners() {
  const host = document.getElementById('banners');
  host.innerHTML = '';

  if (bridge.live && !state.host.elevated) {
    const b = el('div', 'banner');
    const text = el('div');
    text.appendChild(el('strong', null, t('elevation.banner_title')));
    text.appendChild(document.createTextNode(t('elevation.banner_body')));
    b.appendChild(text);

    const btn = el('button', 'btn btn-ghost btn-sm', t('elevation.restart'));
    btn.type = 'button';
    btn.onclick = () => bridge.send('relaunchElevated', {});
    b.appendChild(btn);
    host.appendChild(b);
  }

  if (!state.session) return;

  const q = p(state.session, 'Quality') || {};
  const problems = [];
  const lost = Number(p(q, 'EventsLost') || 0);
  const dropped = Number(p(q, 'EventsDroppedBySink') || 0);
  const fileRate = Number(p(q, 'FileNameHitRate') ?? 1);
  const regRate = Number(p(q, 'RegistryNameHitRate') ?? 1);

  if (lost > 0) problems.push(t('quality.events_lost', formatNumber(lost)));
  if (dropped > 0) problems.push(t('quality.events_dropped', formatNumber(dropped)));
  if (fileRate < 0.95) problems.push(t('quality.file_unresolved', ((1 - fileRate) * 100).toFixed(1)));
  if (regRate < 0.95) problems.push(t('quality.registry_unresolved', ((1 - regRate) * 100).toFixed(1)));
  (p(q, 'CollectorFailures') || []).forEach(f => problems.push(f));
  (p(q, 'SkippedForPrivilege') || []).forEach(f => problems.push(t('quality.skipped', f)));

  const banner = el('div', problems.length === 0 ? 'banner clean' : 'banner');
  const text = el('div');

  /* Stated up front rather than buried. A session that lost events looks exactly like
     a program that did less than it did, and that misreading is the single most
     consequential mistake a reader of this report can make. */
  text.appendChild(el('strong', null, problems.length === 0
    ? t('quality.clean_title') : t('quality.degraded_title')));
  text.appendChild(document.createTextNode(problems.length === 0
    ? t('quality.clean_body') : problems.join(' · ')));

  banner.appendChild(text);
  host.appendChild(banner);
}

/* ============================================================= overview */

function renderOverview() {
  const host = document.getElementById('overviewBody');
  host.innerHTML = '';

  if (!state.session) {
    host.appendChild(emptyState(bridge.live
      ? t('sessions.empty')
      : t('findings.empty')));
    return;
  }

  const s = state.session;
  const head = el('div', 'view-head');
  head.appendChild(el('h2', null, p(s, 'Name') || t('overview.title')));

  const count = state.findings.length;
  head.appendChild(el('p', null,
    count === 0 ? t('overview.headline_none')
      : count === 1 ? t('overview.headline_one')
        : t('overview.headline_many', formatNumber(count))));
  host.appendChild(head);

  const machine = p(s, 'Machine') || {};
  const stats = el('div', 'stat-grid');
  const add = (k, v, small) => {
    const box = el('div', 'stat');
    box.appendChild(el('div', 'k', k));
    box.appendChild(el('div', 'v' + (small ? ' small' : ''), v));
    stats.appendChild(box);
  };

  add(t('common.events'), formatNumber(p(s, 'TotalObservations') ?? state.totalObservations ?? sumCounts()));
  add(t('common.duration'), formatDuration(durationSeconds(s)));
  add(t('common.machine'), (p(machine, 'MachineName') || '') +
      (p(machine, 'IsVirtualMachine') ? ' · ' + (p(machine, 'Hypervisor') || 'VM') : ''), true);
  add(t('common.started'), formatDateTime(p(s, 'StartedAt')), true);
  if (p(s, 'TargetPath')) add(t('common.target'), p(s, 'TargetPath'), true);
  host.appendChild(stats);

  // Category counts, largest first, as a plain readable list rather than a chart:
  // the numbers are what matters and a bar adds no information here.
  const entries = Object.entries(state.counts || {}).sort((a, b) => b[1] - a[1]);
  if (entries.length) {
    const card = el('div', 'card');
    card.appendChild(el('h3', null, t('overview.by_category')));
    const chips = el('div', 'chips');
    entries.forEach(([category, n]) => {
      const chip = el('div', 'chip');
      chip.setAttribute('aria-pressed', 'true');
      chip.style.setProperty('--cat', CATEGORY_COLORS[category] || 'var(--primary)');
      chip.appendChild(el('span', 'dot'));
      chip.appendChild(document.createTextNode(category));
      chip.appendChild(el('span', 'count', formatNumber(n)));
      chips.appendChild(chip);
    });
    card.appendChild(chips);
    host.appendChild(card);
  }

  // A host, not an endpoint: two connections to the same server from two ephemeral
  // ports are one host contacted, and counting them twice inflates every summary.
  const hosts = new Set();
  state.network.flows.forEach(f => hosts.add(f.remoteHost || stripPort(f.remote)));
  state.network.dns.forEach(d => { if (d.query) hosts.add(d.query); });
  hosts.delete('');

  const netCard = el('div', 'card');
  netCard.appendChild(el('h3', null, t('overview.network_summary')));
  netCard.appendChild(el('div', 'hint', hosts.size
    ? t('overview.hosts_contacted', formatNumber(hosts.size))
    : t('overview.no_network')));

  if (state.network.unattributed) {
    netCard.appendChild(el('div', 'hint',
      t('network.unattributed_note', formatNumber(state.network.unattributed))));
  }

  if (hosts.size) {
    const list = el('div', 'chips');
    list.style.marginTop = '10px';
    [...hosts].filter(Boolean).slice(0, 24).forEach(h => {
      const chip = el('div', 'chip');
      chip.style.setProperty('--cat', 'var(--cat-dns)');
      chip.appendChild(el('span', 'dot'));
      chip.appendChild(document.createTextNode(h));
      list.appendChild(chip);
    });
    netCard.appendChild(list);
  }
  host.appendChild(netCard);

  if (state.findings.length) {
    const card = el('div', 'card wide');
    card.appendChild(el('h3', null, t('overview.top_findings')));
    state.findings.slice(0, 8).forEach(f => card.appendChild(renderFinding(f)));

    const more = el('button', 'btn btn-ghost btn-sm', t('overview.read_more'));
    more.type = 'button';
    more.onclick = () => setView('findings');
    card.appendChild(more);
    host.appendChild(card);
  }

  // Present in the exported copy only: the person reading a file that arrived by
  // email is exactly the person who has not been told what is in it.
  if (!bridge.live) {
    const note = el('div', 'banner');
    note.appendChild(el('div', null, t('report.disclaimer')));
    host.appendChild(note);
  }
}

function sumCounts() {
  return Object.values(state.counts || {}).reduce((a, b) => a + Number(b || 0), 0);
}

function durationSeconds(s) {
  const started = p(s, 'StartedAt'), stopped = p(s, 'StoppedAt');
  if (!started || !stopped) return 0;
  return (new Date(stopped) - new Date(started)) / 1000;
}

/* ============================================================== findings */

function renderFindings() {
  const host = document.getElementById('findings');
  host.innerHTML = '';

  const visible = state.findings.filter(f => {
    if (state.hidden.has(f.category)) return false;
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return String(f.target || '').toLowerCase().includes(q)
        || String(f.target2 || '').toLowerCase().includes(q)
        || (f.reasons || []).some(r => r.toLowerCase().includes(q));
  });

  if (visible.length === 0) {
    host.appendChild(emptyState(state.query ? t('findings.no_match', state.query) : t('findings.empty')));
    return;
  }

  const wrap = el('div', 'findings');
  for (const risk of RISK_ORDER) {
    const group = visible.filter(f => f.risk === risk);
    if (group.length === 0) continue;

    const section = el('div', 'risk-group');
    const head = el('div', `risk-head risk-${risk.toLowerCase()}`);
    head.appendChild(el('span', null, t('risk.' + risk.toLowerCase())));
    head.appendChild(el('span', 'badge', formatNumber(group.length)));
    head.appendChild(el('span', 'rule'));
    section.appendChild(head);

    group.forEach(f => section.appendChild(renderFinding(f)));
    wrap.appendChild(section);
  }
  host.appendChild(wrap);
}

function renderFinding(finding) {
  const risk = String(finding.risk || 'Info').toLowerCase();
  const node = el('div', `finding risk-${risk}`);

  const target = finding.target2 && finding.category === 'Registry'
    ? `${finding.target}::${finding.target2}`
    : finding.target;

  const verb = String(finding.action || '').replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase();

  const line = el('div', 'finding-target');
  line.appendChild(el('span', 'finding-verb', verb));
  line.appendChild(document.createTextNode(target || ''));
  node.appendChild(line);

  // A registry transition is the thing the analyst came for; show it inline rather
  // than behind a click.
  if (finding.oldValue || finding.newValue) {
    const change = el('div', 'finding-change');
    change.appendChild(el('span', 'from', finding.oldValue ?? '(not present)'));
    change.appendChild(el('span', 'arrow', '→'));
    change.appendChild(el('span', 'to', finding.newValue ?? '(removed)'));
    node.appendChild(change);
  }

  if ((finding.reasons || []).length) {
    const list = el('ul', 'finding-reasons');
    finding.reasons.forEach(r => list.appendChild(el('li', null, r)));
    node.appendChild(list);
  }

  if (finding.source === 'SnapshotDiff' || finding.confidence === 'None') {
    node.appendChild(el('div', 'finding-note',
      finding.source === 'SnapshotDiff' ? t('findings.snapshot_only') : t('findings.unattributed')));
  }

  // Model output is visually separated from rule output, always. Merging them would
  // let a guess inherit the authority of a measurement.
  const ai = state.ai.report && state.ai.report.byTarget ? state.ai.report.byTarget[finding.target] : null;
  if (ai) {
    if (ai.label) {
      const box = el('div', 'finding-ai');
      box.textContent = `${t('assistant.label')}: ${ai.label}` +
        (ai.labelConfidence ? ` (${ai.labelConfidence})` : '');
      node.appendChild(box);
    }
    if (ai.disagreement) {
      const box = el('div', 'finding-ai conflict');
      box.textContent = `${t('assistant.disagreement')} — ${ai.disagreement}`;
      node.appendChild(box);
    }
    if (ai.reputation) node.appendChild(el('div', 'finding-note', `${t('findings.reputation')}: ${ai.reputation}`));
  }

  return node;
}

function renderChips() {
  const counts = {};
  const walk = n => {
    const c = p(n, 'Category');
    if (c && p(n, 'Kind') === 'ActionGroup') counts[c] = (counts[c] || 0) + (Number(p(n, 'EventCount')) || 0);
    (p(n, 'Children') || []).forEach(walk);
  };
  state.roots.forEach(walk);
  state.findings.forEach(f => { if (!(f.category in counts)) counts[f.category] = counts[f.category] || 0; });

  const host = document.getElementById('chips');
  host.innerHTML = '';

  Object.keys(counts).sort().forEach(cat => {
    const b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(!state.hidden.has(cat)));
    b.style.setProperty('--cat', CATEGORY_COLORS[cat] || 'var(--primary)');
    b.appendChild(el('span', 'dot'));
    b.appendChild(document.createTextNode(cat));
    if (counts[cat]) b.appendChild(el('span', 'count', formatNumber(counts[cat])));
    b.onclick = () => {
      state.hidden.has(cat) ? state.hidden.delete(cat) : state.hidden.add(cat);
      b.setAttribute('aria-pressed', String(!state.hidden.has(cat)));
      renderFindings();
      renderTree();
    };
    host.appendChild(b);
  });
}

/* ================================================================== tree */

function matches(node) {
  if (!state.treeQuery) return true;
  const q = state.treeQuery.toLowerCase();
  if (String(p(node, 'Label') || '').toLowerCase().includes(q)) return true;
  if (String(p(node, 'Sublabel') || '').toLowerCase().includes(q)) return true;
  return (p(node, 'Facts') || []).some(f =>
    String(p(f, 'Value') || f.value || '').toLowerCase().includes(q));
}

/* A node survives filtering if it matches, or if anything beneath it does —
   otherwise searching for a filename would hide the process that created it. */
function visible(node) {
  const cat = p(node, 'Category');
  if (p(node, 'Kind') === 'ActionGroup' && cat && state.hidden.has(cat)) return false;
  if (matches(node)) return true;
  return (p(node, 'Children') || []).some(visible);
}

function renderTree() {
  const host = document.getElementById('tree');
  host.innerHTML = '';

  const shown = state.roots.filter(visible);
  if (shown.length === 0) {
    host.appendChild(emptyState(state.treeQuery
      ? t('findings.no_match', state.treeQuery) : t('tree.empty')));
    return;
  }
  shown.forEach(n => host.appendChild(renderNode(n)));
}

function renderNode(node) {
  const id = p(node, 'Id');
  // Enum names, not ordinals: the payload writes them as strings so the report stays
  // readable and a renamed enum member fails loudly instead of silently shifting
  // every node to the wrong kind.
  const kind = String(p(node, 'Kind') ?? 'Artifact');

  const wrap = el('div', `node node-kind-${kind.toLowerCase()}`);
  const children = (p(node, 'Children') || []).filter(visible);

  // Auto-expand while searching: a hit buried four levels down is useless if the
  // analyst has to guess which branch to open.
  const isOpen = state.expanded.has(id) || (!!state.treeQuery && children.length > 0);

  const row = el('div', 'node-row');
  row.setAttribute('role', 'treeitem');
  row.setAttribute('aria-selected', String(state.selected === id));
  row.style.setProperty('--cat', CATEGORY_COLORS[p(node, 'Category')] || 'var(--primary)');

  const twisty = el('span', 'twisty' + (children.length ? (isOpen ? ' open' : '') : ' leaf'), '▶');
  twisty.onclick = e => {
    e.stopPropagation();
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    renderTree();
  };
  row.appendChild(twisty);
  row.appendChild(el('span', 'node-label', p(node, 'Label') || ''));

  const sub = p(node, 'Sublabel');
  if (sub) row.appendChild(el('span', 'node-sub', sub));

  const count = Number(p(node, 'EventCount') || 0);
  if (kind === 'ActionGroup' && count > 0) row.appendChild(el('span', 'badge', formatNumber(count)));

  // Disk and network totals are shown separately. Folding file writes into a "sent"
  // figure would make a process that wrote to a local cache look like one that
  // uploaded the same volume.
  const written = Number(p(node, 'BytesWritten') || 0);
  if (written) row.appendChild(el('span', 'badge bytes', `${formatBytes(written)} ${t('tree.written')}`));

  const sent = Number(p(node, 'BytesSent') || 0);
  const recv = Number(p(node, 'BytesReceived') || 0);
  if (sent || recv) row.appendChild(el('span', 'badge bytes', `${formatBytes(sent)} ↑ ${formatBytes(recv)} ↓`));

  // Attribution quality is on the row, not hidden in a panel: an edge that was
  // inferred rather than observed changes what the reader can claim from it.
  const conf = String(p(node, 'Confidence') ?? 'Direct');
  if (conf === 'Probable' || conf === 'Weak') row.appendChild(el('span', 'badge inferred', conf.toLowerCase()));
  if (String(p(node, 'Source')) === 'SnapshotDiff') row.appendChild(el('span', 'badge snapshot', 'snapshot diff'));

  row.onclick = () => { state.selected = id; renderDetail(node); renderTree(); };
  wrap.appendChild(row);

  const facts = p(node, 'Facts') || [];
  const from = facts.find(f => (p(f, 'Key') || f.key) === 'from');
  const to = facts.find(f => (p(f, 'Key') || f.key) === 'to');
  if (from || to) {
    const tr = el('div', 'transition');
    tr.appendChild(el('span', 'from', from ? (p(from, 'Value') || from.value) : '(not present)'));
    tr.appendChild(el('span', 'arrow', '→'));
    tr.appendChild(el('span', 'to', to ? (p(to, 'Value') || to.value) : '(removed)'));
    wrap.appendChild(tr);
  }

  if (isOpen && children.length) {
    const kids = el('div', 'node-children');
    children.forEach(c => kids.appendChild(renderNode(c)));

    const truncated = Number(p(node, 'TruncatedChildren') || 0);
    if (truncated > 0) {
      const more = el('div', 'node-row');
      more.appendChild(el('span', 'twisty leaf'));
      more.appendChild(el('span', 'node-sub', t('tree.more_hidden', formatNumber(truncated))));
      kids.appendChild(more);
    }
    wrap.appendChild(kids);
  }

  return wrap;
}

function renderDetail(node) {
  const host = document.getElementById('detail');
  const facts = p(node, 'Facts') || [];

  const meta = [
    ['category', p(node, 'Category')],
    ['events', formatNumber(p(node, 'EventCount') || 0)],
    ['first seen', formatDateTime(p(node, 'FirstSeen'))],
    ['last seen', formatDateTime(p(node, 'LastSeen'))],
    ['written', Number(p(node, 'BytesWritten')) ? formatBytes(p(node, 'BytesWritten')) : null],
    ['sent', Number(p(node, 'BytesSent')) ? formatBytes(p(node, 'BytesSent')) : null],
    ['received', Number(p(node, 'BytesReceived')) ? formatBytes(p(node, 'BytesReceived')) : null],
    ['evidence rows', (p(node, 'Evidence') || []).length || null],
  ].filter(([, v]) => v !== null && v !== undefined && v !== '' && v !== '0');

  host.innerHTML =
    `<h2>${esc(p(node, 'Label'))}</h2><div class="muted">${esc(p(node, 'Sublabel') || '')}</div>` +
    `<table class="fact-table">` +
    meta.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('') +
    facts.map(f => `<tr><th>${esc(p(f, 'Key') || f.key)}</th><td>${esc(p(f, 'Value') || f.value)}</td></tr>`).join('') +
    `</table>`;
}

/* ============================================================== network */

const NETWORK_TABS = [
  { id: 'requests', key: 'network.tab_requests' },
  { id: 'flows', key: 'network.tab_flows' },
  { id: 'dns', key: 'network.tab_dns' },
  { id: 'tls', key: 'network.tab_tls' },
];

function renderNetwork() {
  const tabs = document.getElementById('networkTabs');
  tabs.innerHTML = '';
  NETWORK_TABS.forEach(tab => {
    const b = el('button', 'tab');
    b.type = 'button';
    b.setAttribute('aria-selected', String(state.networkTab === tab.id));
    b.appendChild(document.createTextNode(t(tab.key)));
    const n = (state.network[tab.id] || []).length;
    if (n) b.appendChild(el('span', 'badge', formatNumber(n)));
    b.onclick = () => { state.networkTab = tab.id; renderNetwork(); };
    tabs.appendChild(b);
  });

  const host = document.getElementById('networkBody');
  host.innerHTML = '';

  const rows = state.network[state.networkTab] || [];
  if (!rows.length) {
    host.appendChild(emptyState(t('network.empty')));

    // An empty HTTP table next to a populated connections table is not "it sent
    // nothing" — it is "its URLs were not visible from here". Saying which is the
    // difference between a reader concluding the program was quiet and understanding
    // that they need to turn interception on.
    if (state.networkTab === 'requests'
        && (state.network.flows.length || state.network.tls.length)) {
      host.appendChild(el('div', 'hint', t('network.no_urls')));
    }

    if (state.network.unattributed) {
      host.appendChild(el('div', 'hint',
        t('network.unattributed_note', formatNumber(state.network.unattributed))));
    }
    return;
  }

  if (state.network.unattributed) {
    host.appendChild(el('div', 'hint',
      t('network.unattributed_note', formatNumber(state.network.unattributed))));
  }
  if (state.network.truncated) host.appendChild(el('div', 'hint', t('network.truncated_note')));

  if (state.networkTab === 'requests') {
    host.appendChild(table(
      [t('network.col_when'), t('network.col_process'), t('network.col_method'),
       t('network.col_url'), t('network.col_status'), t('network.col_bytes')],
      rows,
      r => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(formatTime(r.when), 'nowrap'));
        tr.appendChild(cell(r.process || t('network.unattributed'), 'nowrap'));

        const m = document.createElement('td');
        if (r.method) {
          const span = el('span', 'method ' + String(r.method).toLowerCase(), r.method);
          m.appendChild(span);
        }
        tr.appendChild(m);

        tr.appendChild(cell(r.url, 'mono wide'));

        const st = document.createElement('td');
        if (r.status) {
          st.className = String(r.status).startsWith('2') || String(r.status).startsWith('3')
            ? 'status-ok' : 'status-bad';
          st.textContent = r.status;
        }
        tr.appendChild(st);

        const bytes = document.createElement('td');
        bytes.className = 'num';
        bytes.textContent = r.bytes ? formatBytes(r.bytes) : '';
        // "Proxy" means the body is in the session; the ETW stacks see a URL and a
        // length only. Saying which prevents "no body" reading as "nothing was sent".
        bytes.title = r.source === 'Proxy' ? t('network.body_captured') : t('network.encrypted');
        tr.appendChild(bytes);
        return tr;
      }));
  } else if (state.networkTab === 'flows') {
    host.appendChild(table(
      [t('network.col_process'), t('network.col_protocol'), t('network.col_remote'),
       t('network.col_host'), t('network.col_sent'), t('network.col_received')],
      rows,
      r => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(r.process || t('network.unattributed'), 'nowrap'));
        tr.appendChild(cell(r.protocol, 'nowrap'));
        tr.appendChild(cell(r.remote, 'mono nowrap'));
        tr.appendChild(cell(r.remoteHost || '', 'mono'));
        tr.appendChild(cell(formatBytes(r.sent), 'num'));
        tr.appendChild(cell(formatBytes(r.received), 'num'));
        return tr;
      }));
  } else if (state.networkTab === 'dns') {
    host.appendChild(table(
      [t('network.col_when'), t('network.col_process'), t('network.col_query'), t('network.col_answer')],
      rows,
      r => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(formatTime(r.when), 'nowrap'));
        tr.appendChild(cell(r.process || t('network.unattributed'), 'nowrap'));
        tr.appendChild(cell(r.query, 'mono'));
        tr.appendChild(cell(r.answer || '', 'mono'));
        return tr;
      }));
  } else {
    host.appendChild(table(
      [t('network.col_when'), t('network.col_process'), t('network.col_sni'), t('network.col_protocol')],
      rows,
      r => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(formatTime(r.when), 'nowrap'));
        tr.appendChild(cell(r.process || t('network.unattributed'), 'nowrap'));
        tr.appendChild(cell(r.serverName, 'mono'));
        tr.appendChild(cell([r.protocol, r.cipher].filter(Boolean).join(' · '), 'mono'));
        return tr;
      }));
  }
}

/* ============================================================== capture */

const CAPTURE_MODES = [
  { id: 'launch', key: 'capture.mode.launch', hint: 'capture.mode.launch_hint' },
  { id: 'attach', key: 'capture.mode.attach', hint: 'capture.mode.attach_hint' },
  { id: 'system', key: 'capture.mode.system', hint: 'capture.mode.system_hint' },
];

const CAPTURE_OPTIONS = [
  { id: 'snapshots', key: 'capture.opt.snapshots', hint: 'capture.opt.snapshots_hint', def: true },
  { id: 'reads', key: 'capture.opt.reads', hint: 'capture.opt.reads_hint', def: false },
  { id: 'scoped', key: 'capture.opt.scoped', hint: 'capture.opt.scoped_hint', def: false },
  { id: 'packets', key: 'capture.opt.packets', hint: 'capture.opt.packets_hint', def: false },
  { id: 'intercept', key: 'capture.opt.intercept', hint: 'capture.opt.intercept_hint', def: false, danger: true },
];

function renderCapture() {
  if (!bridge.live) return;

  const modes = document.getElementById('captureModes');
  if (!modes.childElementCount) {
    CAPTURE_MODES.forEach(mode => {
      const label = el('label', 'choice');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'captureMode';
      input.value = mode.id;
      input.checked = mode.id === state.capture.mode;
      input.onchange = () => { state.capture.mode = mode.id; syncCaptureFields(); };
      label.appendChild(input);

      const body = el('div');
      body.appendChild(el('div', 't', t(mode.key)));
      body.appendChild(el('div', 'd', t(mode.hint)));
      label.appendChild(body);
      modes.appendChild(label);
    });

    const options = document.getElementById('captureOptions');
    CAPTURE_OPTIONS.forEach(opt => {
      const label = el('label', 'toggle');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = 'opt_' + opt.id;
      input.checked = opt.def;
      label.appendChild(input);

      const body = el('div');
      body.appendChild(el('div', 't', t(opt.key)));
      body.appendChild(el('div', 'd', t(opt.hint)));
      label.appendChild(body);
      options.appendChild(label);
    });
  } else {
    // Language switch: relabel in place rather than rebuilding, so a half-filled
    // form is not wiped by choosing a different language.
    [...modes.children].forEach((label, i) => {
      label.querySelector('.t').textContent = t(CAPTURE_MODES[i].key);
      label.querySelector('.d').textContent = t(CAPTURE_MODES[i].hint);
    });
    [...document.getElementById('captureOptions').children].forEach((label, i) => {
      label.querySelector('.t').textContent = t(CAPTURE_OPTIONS[i].key);
      label.querySelector('.d').textContent = t(CAPTURE_OPTIONS[i].hint);
    });
  }

  syncCaptureFields();
  renderCaptureLive();
}

function syncCaptureFields() {
  const mode = state.capture.mode;
  document.getElementById('fieldsLaunch').hidden = mode !== 'launch';
  document.getElementById('fieldPid').hidden = mode !== 'attach';
}

function renderCaptureLive() {
  const host = document.getElementById('captureLive');
  const form = document.getElementById('captureForm');
  const busy = state.capture.state !== 'idle';

  form.hidden = busy;
  host.innerHTML = '';
  if (!busy) return;

  const panel = el('div', 'live-panel');
  const heading = el('div');
  heading.style.gridColumn = '1 / -1';

  const title = el('div');
  title.style.fontWeight = '700';
  if (state.capture.state === 'running') title.appendChild(el('span', 'rec-dot'));
  title.appendChild(document.createTextNode(
    state.capture.state === 'starting' ? t('capture.starting')
      : state.capture.state === 'stopping' ? t('capture.stopping')
        : t('capture.running')));
  heading.appendChild(title);
  heading.appendChild(el('div', 'hint', t('capture.live_hint')));
  panel.appendChild(heading);

  const stat = (k, v) => {
    const box = el('div');
    box.appendChild(el('div', 'k', k));
    const value = el('div', 'v', v);
    value.style.fontFamily = 'var(--font-mono)';
    value.style.fontSize = '22px';
    value.style.fontWeight = '700';
    box.appendChild(value);
    panel.appendChild(box);
  };

  stat(t('capture.live_events'), formatNumber(state.capture.events));
  stat(t('capture.live_elapsed'), formatDuration(state.capture.elapsed));

  const actions = el('div');
  actions.style.gridColumn = '1 / -1';

  if (state.capture.state === 'running') {
    const stop = el('button', 'btn btn-primary', t('capture.stop'));
    stop.type = 'button';
    stop.onclick = () => bridge.send('stopCapture', {});
    actions.appendChild(stop);
  } else {
    const bar = el('div', 'progress indeterminate');
    bar.appendChild(el('div'));
    actions.appendChild(bar);
  }
  panel.appendChild(actions);

  host.appendChild(panel);
}

function startCapture() {
  const mode = state.capture.mode;
  const target = document.getElementById('capTarget').value.trim();
  const pid = Number(document.getElementById('capPid').value || 0);

  if (mode === 'launch' && !target) { toast(t('capture.needs_target'), 'error'); return; }
  if (mode === 'attach' && !pid) { toast(t('capture.needs_pid'), 'error'); return; }

  const options = {};
  CAPTURE_OPTIONS.forEach(o => { options[o.id] = document.getElementById('opt_' + o.id).checked; });

  bridge.send('startCapture', {
    mode,
    target,
    args: document.getElementById('capArgs').value,
    pid,
    name: document.getElementById('capName').value.trim(),
    duration: Number(document.getElementById('capDuration').value || 0),
    root: document.getElementById('capRoot').value.trim(),
    options,
  });
}

/* ============================================================= sessions */

function requestSessions() {
  bridge.send('listSessions', { root: document.getElementById('capRoot').value.trim() || state.host.sessionRoot });
}

function renderSessions() {

  host.innerHTML = '';

  document.getElementById('sessionRootLabel').textContent = state.host.sessionRoot || '';

/* ============================================================ assistant */

function requestAiStatus() {
  const endpoint = document.getElementById('ollamaEndpoint').value.trim();
  document.getElementById('aiStatus').textContent = t('assistant.status_checking');
  bridge.send('aiStatus', { endpoint });
}

function renderAi() {
  const statusHost = document.getElementById('aiStatus');
  if (!statusHost) return;

  const status = state.ai.status;
  if (status) {
    statusHost.innerHTML = '';
    const pill = el('span', 'pill ' + (status.reachable ? 'ok' : 'bad'));
    pill.appendChild(el('span', 'led'));
    pill.appendChild(document.createTextNode(status.reachable
      ? t('assistant.status_up', status.models ? status.models.length : 0)
      : t('assistant.status_down', status.endpoint || '')));
    statusHost.appendChild(pill);
    if (!status.reachable) statusHost.appendChild(el('div', 'hint', t('assistant.status_down_hint')));
  }

  const modelHost = document.getElementById('aiModels');
  modelHost.innerHTML = '';

  if (state.ai.busy && state.ai.progress) {
    modelHost.appendChild(el('div', 'hint', state.ai.progress));
    const bar = el('div', 'progress indeterminate');
    bar.appendChild(el('div'));
    modelHost.appendChild(bar);
  }

  if (state.ai.assessments.length) {
    modelHost.appendChild(table(
      [t('assistant.col_model'), t('assistant.col_verdict'), t('assistant.col_correct'), t('assistant.col_latency')],
      state.ai.assessments,
      a => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(a.model, 'mono'));

        const verdict = document.createElement('td');
        const key = 'assistant.suitability.' + String(a.suitability || '').toLowerCase();
        const pill = el('span', 'pill ' + (a.suitability === 'Suitable' ? 'ok'
          : a.suitability === 'Limited' ? 'warn' : 'bad'));
        pill.appendChild(el('span', 'led'));
        pill.appendChild(document.createTextNode(t(key)));
        verdict.appendChild(pill);
        tr.appendChild(verdict);

        tr.appendChild(cell(`${a.correct}/${a.total}`, 'num'));
        tr.appendChild(cell(`${Number(a.latencySeconds || 0).toFixed(1)}s`, 'num'));
        return tr;
      }));

    const best = state.ai.assessments.find(a => a.suitability === 'Suitable');
    modelHost.appendChild(el('div', 'hint',
      best ? t('assistant.recommended', best.model) : t('assistant.none_suitable')));
  } else if (state.ai.status && state.ai.status.models) {
    const list = el('div', 'chips');
    state.ai.status.models.forEach(m => list.appendChild(el('span', 'chip', m)));
    modelHost.appendChild(list);
  }

  const select = document.getElementById('aiModel');
  const current = select.value;
  select.innerHTML = '';
  const none = document.createElement('option');
  none.value = '';
  none.textContent = t('assistant.analyse_without');
  select.appendChild(none);
  ((state.ai.status && state.ai.status.models) || []).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });
  if (current) select.value = current;

  renderAiReport();
}

function renderAiReport() {
  const host = document.getElementById('aiReport');
  host.innerHTML = '';

  const report = state.ai.report;
  if (state.ai.busy && state.ai.progress) {
    host.appendChild(el('div', 'hint', state.ai.progress));
    const bar = el('div', 'progress indeterminate');
    bar.appendChild(el('div'));
    host.appendChild(bar);
    return;
  }
  if (!report) return;

  (report.findings || []).forEach(f => {
    const node = el('div', `finding risk-${String(f.risk || 'Info').toLowerCase()}`);
    node.appendChild(el('div', 'finding-target', f.artifact));
    if ((f.reasons || []).length) {
      const list = el('ul', 'finding-reasons');
      f.reasons.forEach(r => list.appendChild(el('li', null, r)));
      node.appendChild(list);
    }
    if (f.label) node.appendChild(el('div', 'finding-ai', `${t('assistant.label')}: ${f.label} (${f.labelConfidence || ''})`));
    if (f.reputation) node.appendChild(el('div', 'finding-note', `${t('findings.reputation')}: ${f.reputation}`));
    // Shown, never resolved: silently preferring one reading would present a guess
    // as a finding.
    if (f.disagreement) node.appendChild(el('div', 'finding-ai conflict', f.disagreement));
    host.appendChild(node);
  });

  if ((report.caveats || []).length) {
    const card = el('div', 'card');
    card.appendChild(el('h3', null, t('assistant.caveats')));
    const list = el('ul', 'finding-reasons');
    report.caveats.forEach(c => list.appendChild(el('li', null, c)));
    card.appendChild(list);
    host.appendChild(card);
  }

  host.appendChild(el('div', 'hint',
    report.modelWasUsed ? t('assistant.model_used') : t('assistant.no_model_used')));
}

/* ============================================================== compare */

function renderCompare() {
  const host = document.getElementById('compareInputs');
  if (!host) return;
  host.innerHTML = '';

  state.compare.inputs.forEach((path, index) => {
    const item = el('div', 'list-item');
    const body = el('div', 'grow');
    body.appendChild(el('div', 'title', path.split(/[\\/]/).filter(Boolean).pop() || path));
    body.appendChild(el('div', 'sub', path));
    item.appendChild(body);

    const remove = el('button', 'btn btn-ghost btn-sm', '✕');
    remove.type = 'button';
    remove.onclick = () => { state.compare.inputs.splice(index, 1); renderCompare(); };
    item.appendChild(remove);
    host.appendChild(item);
  });

  const body = document.getElementById('compareBody');
  body.innerHTML = '';

  const result = state.compare.result;
  if (!result) return;

  const groups = [
    { key: 'compare.stable', rows: result.stable || [], hint: 'compare.stable_hint' },
    { key: 'compare.partial', rows: result.partial || [] },
    { key: 'compare.unique', rows: result.unique || [] },
  ];

  groups.forEach(group => {
    if (!group.rows.length) return;
    const card = el('div', 'card wide');
    card.appendChild(el('h3', null, `${t(group.key)} · ${formatNumber(group.rows.length)}`));
    if (group.hint) card.appendChild(el('div', 'hint', t(group.hint)));

    card.appendChild(table(
      [t('compare.col_artifact'), t('compare.col_seen_on'), t('compare.col_template')],
      group.rows.slice(0, 400),
      r => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(r.target, 'mono wide'));
        tr.appendChild(cell(`${r.origins}/${result.originCount}`, 'num'));
        tr.appendChild(cell(r.template || '', 'mono'));
        return tr;
      }));
    body.appendChild(card);
  });

  if ((result.stable || []).length) {
    body.appendChild(el('div', 'hint', t('compare.template_hint')));
    const btn = el('button', 'btn btn-primary', t('compare.export_package'));
    btn.type = 'button';
    btn.style.marginTop = '12px';
    btn.onclick = () => bridge.send('compareExportPackage', { sessions: state.compare.inputs });
    body.appendChild(btn);
  }
}

/* ============================================================ remediate */

const PLAN_OPTIONS = [
  { id: 'includeModified', key: 'remediate.opt.modified', hint: 'remediate.opt.modified_hint', def: false },
  { id: 'includeTemp', key: 'remediate.opt.temp', def: false },
  { id: 'includeOutOfScope', key: 'remediate.opt.out_of_scope', def: false },
];

function renderPlanOptions() {
  const host = document.getElementById('planOptions');
  if (!host) return;

  if (!host.childElementCount) {
    PLAN_OPTIONS.forEach(opt => {
      const label = el('label', 'toggle');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = 'plan_' + opt.id;
      input.checked = opt.def;
      label.appendChild(input);

      const body = el('div');
      body.appendChild(el('div', 't', t(opt.key)));
      if (opt.hint) body.appendChild(el('div', 'd', t(opt.hint)));
      label.appendChild(body);
      host.appendChild(label);
    });
  } else {
    [...host.children].forEach((label, i) => {
      label.querySelector('.t').textContent = t(PLAN_OPTIONS[i].key);
      const d = label.querySelector('.d');
      if (d && PLAN_OPTIONS[i].hint) d.textContent = t(PLAN_OPTIONS[i].hint);
    });
  }
}

function renderPlan() {
  const host = document.getElementById('planBody');
  if (!host) return;
  host.innerHTML = '';

  const plan = state.plan;
  if (!plan) return;

  if (!plan.items || !plan.items.length) {
    host.appendChild(emptyState(t('remediate.empty')));
    return;
  }

  const byKind = {};
  plan.items.forEach(i => { (byKind[i.kind] = byKind[i.kind] || []).push(i); });

  Object.keys(byKind).sort().forEach(kind => {
    const card = el('div', 'card wide');
    const key = 'remediate.kind.' + kind.toLowerCase();
    card.appendChild(el('h3', null, `${t(key)} · ${formatNumber(byKind[kind].length)}`));

    card.appendChild(table(
      ['', t('remediate.col_item'), t('remediate.col_evidence')],
      byKind[kind],
      item => {
        const tr = document.createElement('tr');

        const pick = document.createElement('td');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !item.protected;
        box.disabled = !!item.protected;
        box.style.width = 'auto';
        box.dataset.itemId = item.id;
        box.className = 'plan-pick';
        pick.appendChild(box);
        tr.appendChild(pick);

        tr.appendChild(cell(item.target, 'mono wide'));
        tr.appendChild(cell(item.protected ? t('remediate.protected') : (item.reason || ''), null));
        return tr;
      }));
    host.appendChild(card);
  });

  const actions = el('div', 'row tight wrap');
  actions.style.marginTop = '4px';

  const exportBtn = el('button', 'btn btn-primary', t('remediate.export'));
  exportBtn.type = 'button';
  exportBtn.onclick = () => bridge.send('exportPackage', { ids: selectedPlanIds() });
  actions.appendChild(exportBtn);

  const applyBtn = el('button', 'btn btn-danger', t('remediate.apply'));
  applyBtn.type = 'button';
  applyBtn.onclick = () => confirmApply();
  actions.appendChild(applyBtn);

  host.appendChild(actions);
  host.appendChild(el('div', 'hint', t('remediate.export_hint')));
}

function selectedPlanIds() {
  return [...document.querySelectorAll('.plan-pick')].filter(b => b.checked).map(b => b.dataset.itemId);
}

/* Applying a plan is the only action in this UI that changes the machine it runs on
   without a program having asked for it. It gets a confirmation that states the count,
   the quarantine location, and the fact that nothing is deleted. */
function confirmApply() {
  const ids = selectedPlanIds();
  if (!ids.length) return;

  showModal({
    title: t('remediate.apply_confirm_title', formatNumber(ids.length)),
    body: t('remediate.apply_confirm_body', (state.plan && state.plan.quarantine) || ''),
    actions: [
      { label: t('common.cancel') },
      { label: t('remediate.apply'), className: 'btn-danger',
        onClick: () => bridge.send('applyPlan', { ids }) },
    ],
  });
}

function renderFleet() {
  const host = document.getElementById('fleetBody');
  if (!host) return;
  host.innerHTML = '';

  const fleet = state.fleet || { listening: false, port: state.host.fleetPort, agents: [] };

  const card = el('div', 'card');

    newCode.type = 'button';
    newCode.style.marginTop = '10px';
    newCode.onclick = () => bridge.send('fleetNewCode', {});
    card.appendChild(newCode);

    const cmdLabel = el('div', 'hint');
    cmdLabel.style.marginTop = '14px';
    cmdLabel.textContent = t('fleet.agent_command');
    card.appendChild(cmdLabel);
    card.appendChild(el('div', 'code',

    const box = el('div', 'card');
    box.style.borderColor = 'rgba(220, 38, 38, 0.4)';

    box.appendChild(el('div', 'hint', t('fleet.fingerprint_hint')));

    const actions = el('div', 'row tight');

    actions.appendChild(approve);

    const reject = el('button', 'btn btn-danger', t('fleet.reject'));

    reject.onclick = () => bridge.send('fleetDecide', { agent: agent.id, approve: false });
    actions.appendChild(reject);
    box.appendChild(actions);

    box.appendChild(el('div', 'hint', t('fleet.approve_hint')));
    host.appendChild(box);
  });

  const card2 = el('div', 'card wide');
  card2.appendChild(el('h3', null, t('fleet.connected')));

    card2.appendChild(el('div', 'hint', fleet.listening ? t('fleet.waiting') : ''));

    card2.appendChild(table(
      [t('fleet.agent_col_machine'), t('fleet.agent_col_state'), t('fleet.agent_col_events')],
      agents,
      a => {
        const tr = document.createElement('tr');

        tr.appendChild(cell(t('fleet.state_' + (a.state || 'gone')), 'nowrap'));
        tr.appendChild(cell(formatNumber(a.events || 0), 'num'));
        return tr;
      }));

    actions.style.marginTop = '12px';

    const start = el('button', 'btn btn-primary', t('fleet.start_collection'));
    start.type = 'button';
    start.onclick = () => bridge.send('fleetCollect', { start: true });

    const stop = el('button', 'btn btn-ghost', t('fleet.stop_collection'));
    stop.type = 'button';
    stop.onclick = () => bridge.send('fleetCollect', { start: false });
    actions.appendChild(stop);
    card2.appendChild(actions);
  }

  card2.appendChild(el('div', 'hint', t('fleet.no_remote_invasive')));
  host.appendChild(card2);
}

/* =============================================================== export */

const EXPORT_FORMATS = ['html', 'json', 'csv', 'tree', 'package'];
const EXPORT_SCOPES = ['minimal', 'standard', 'full'];

function openExportDialog() {
  if (!state.session) { toast(t('findings.empty')); return; }

  const form = el('div');

  const formatSet = el('div', 'choice-set');
  formatSet.style.marginTop = '14px';
  EXPORT_FORMATS.forEach((f, i) => {
    // Only the live app can build a package: it re-reads the session database.
    if (f === 'package' && !bridge.live) return;

    const label = el('label', 'choice');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'exportFormat';
    input.value = f;
    input.checked = i === 0;
    label.appendChild(input);

    const body = el('div');
    body.appendChild(el('div', 't', t('export.format.' + f)));
    body.appendChild(el('div', 'd', t('export.format.' + f + '_hint')));
    label.appendChild(body);
    formatSet.appendChild(label);
  });
  form.appendChild(el('div', 'label', t('export.format')));
  form.appendChild(formatSet);

  const scopeSet = el('div', 'choice-set');
  EXPORT_SCOPES.forEach((s, i) => {
    const label = el('label', 'choice');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'exportScope';
    input.value = s;
    input.checked = i === 1;
    label.appendChild(input);

    const body = el('div');
    body.appendChild(el('div', 't', t('export.scope.' + s)));
    body.appendChild(el('div', 'd', t('export.scope.' + s + '_hint')));
    label.appendChild(body);
    scopeSet.appendChild(label);
  });
  form.appendChild(el('div', 'label', t('export.scope')));
  form.appendChild(scopeSet);

  form.appendChild(el('div', 'label', t('export.categories')));
  const cats = el('div', 'chips');
  const categories = Object.keys(state.counts || {}).sort();
  const chosen = new Set(categories);
  categories.forEach(c => {
    const b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'true');
    b.style.setProperty('--cat', CATEGORY_COLORS[c] || 'var(--primary)');
    b.appendChild(el('span', 'dot'));
    b.appendChild(document.createTextNode(c));
    b.onclick = () => {
      chosen.has(c) ? chosen.delete(c) : chosen.add(c);
      b.setAttribute('aria-pressed', String(chosen.has(c)));
    };
    cats.appendChild(b);
  });
  form.appendChild(cats);
  form.appendChild(el('div', 'hint', t('export.categories_hint')));

  showModal({
    title: t('export.title'),
    body: t('export.subtitle'),
    extra: form,
    actions: [
      { label: t('common.cancel') },
      {
        label: t('export.write'), className: 'btn-primary',
        onClick: () => {
          const format = form.querySelector('input[name=exportFormat]:checked').value;
          const scope = form.querySelector('input[name=exportScope]:checked').value;
          if (!bridge.live) { exportLocally(format); return; }
          bridge.send('export', {
            format, scope,
            categories: chosen.size === categories.length ? [] : [...chosen],
          });
        },
      },
    ],
  });
}

/* An exported report can still produce a JSON or CSV of what it contains, without an
   engine: the data it needs is already in the page. */
function exportLocally(format) {
  const data = window.__CAYATRACE_DATA__ || {};
  let text, mime, ext;

  if (format === 'csv') {
    const cell = v => {
      let s = String(v ?? '');
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = [['risk', 'score', 'category', 'action', 'target', 'target2', 'old', 'new', 'reasons']];
    (data.findings || []).forEach(f => rows.push([
      f.risk, f.score, f.category, f.action, f.target, f.target2, f.oldValue, f.newValue,
      (f.reasons || []).join(' | '),
    ]));
    text = rows.map(r => r.map(cell).join(',')).join('\r\n');
    mime = 'text/csv'; ext = 'csv';
  } else {
    text = JSON.stringify(data, null, 2);
    mime = 'application/json'; ext = 'json';
  }

  const blob = new Blob(["﻿", text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ((data.session && (data.session.Name || data.session.name)) || 'cayatrace') + '.' + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ================================================================ load */

function load(data) {
  state.session = data.session || null;
  state.roots = data.tree || [];
  state.findings = data.findings || [];
  state.counts = data.counts || {};
  state.totalObservations = data.totalObservations || 0;
  state.network = Object.assign({ requests: [], flows: [], dns: [], tls: [] }, data.network || {});

  // Open on a tab that has something in it. Landing on an empty HTTP table when the
  // evidence is in Connections makes the session look emptier than it is.
  const firstPopulated = NETWORK_TABS.find(tab => (state.network[tab.id] || []).length);
  if (firstPopulated) state.networkTab = firstPopulated.id;
  state.processes = data.processes || [];

  state.expanded = new Set();
  // Process nodes start open; everything below stays collapsed so an installer that
  // touched 40,000 files does not render 40,000 rows before the analyst has looked.
  state.roots.forEach(r => state.expanded.add(p(r, 'Id')));

  if (data.language && CATALOGUE[data.language]) LANG = data.language;

  renderAll();

  // Landing on a section that was empty a moment ago is disorienting; landing on the
  // overview of the session that just loaded is not. A view chosen with --view is left
  // alone, because it was chosen.
  if (!state.pinnedView && (!bridge.live || state.view === 'capture' || state.view === 'sessions'))
    setView('overview');
}

function renderAll() {
  renderBanners();
  renderNav();
  renderSessionChip();
  renderOverview();
  renderChips();
  renderFindings();
  renderTree();
  renderNetwork();
  if (bridge.live) {
    renderCapture();
    renderSessions();
    renderAi();
    renderCompare();
    renderPlanOptions();
    renderPlan();
    renderFleet();
  }
}

function renderSessionChip() {
  const chip = document.getElementById('sessionChip');
  if (!state.session) { chip.textContent = t('common.no_session'); return; }
  const started = p(state.session, 'StartedAt');
  chip.textContent = `${p(state.session, 'Name') || t('common.session')} · ${formatDateTime(started)}`;
}

/* ================================================================ wire */

function wire() {
  document.getElementById('search').addEventListener('input', e => {
    state.query = e.target.value.trim();
    renderFindings();
  });

  document.getElementById('treeSearch').addEventListener('input', e => {
    state.treeQuery = e.target.value.trim();
    renderTree();
  });

  document.getElementById('showReads').addEventListener('change', e => {
    state.showReads = e.target.checked;
    bridge.send('setIncludeReads', { value: state.showReads });
  });

  document.getElementById('btnExpand').onclick = () => {
    const walk = n => { state.expanded.add(p(n, 'Id')); (p(n, 'Children') || []).forEach(walk); };
    state.roots.forEach(walk);
    renderTree();
  };

  document.getElementById('btnCollapse').onclick = () => {
    state.expanded.clear();
    state.roots.forEach(r => state.expanded.add(p(r, 'Id')));
    renderTree();
  };

  document.getElementById('btnExport').onclick = openExportDialog;

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  if (!bridge.live) return;

  document.getElementById('btnOpenSession').onclick = () => bridge.send('pickFolder', { purpose: 'openSession' });
  document.getElementById('btnPickTarget').onclick = () => bridge.send('pickFile', { purpose: 'target' });
  document.getElementById('btnPickRoot').onclick = () => bridge.send('pickFolder', { purpose: 'sessionRoot' });
  document.getElementById('btnChangeRoot').onclick = () => bridge.send('pickFolder', { purpose: 'sessionRoot' });
  document.getElementById('btnRefreshSessions').onclick = requestSessions;
  document.getElementById('btnStartCapture').onclick = startCapture;

  document.getElementById('btnAiStatus').onclick = requestAiStatus;
  document.getElementById('btnAiProbe').onclick = () => {
    state.ai.busy = true;
    state.ai.progress = t('common.loading');
    renderAi();
    bridge.send('aiProbe', { endpoint: document.getElementById('ollamaEndpoint').value.trim() });
  };
  document.getElementById('btnAiAnalyse').onclick = () => {
    state.ai.busy = true;
    state.ai.progress = t('common.loading');
    renderAi();
    bridge.send('aiExplain', {
      endpoint: document.getElementById('ollamaEndpoint').value.trim(),
      model: document.getElementById('aiModel').value,
    });
  };
  document.getElementById('btnVtRun').onclick = () => {
    bridge.send('vtLookup', { key: document.getElementById('vtKey').value });
  };

  document.getElementById('btnCompareAdd').onclick = () => bridge.send('pickFolder', { purpose: 'compare' });
  document.getElementById('btnCompareRun').onclick = () => {
    if (state.compare.inputs.length < 2) { toast(t('compare.need_two'), 'error'); return; }
    bridge.send('compareRun', { sessions: state.compare.inputs });
  };

  document.getElementById('btnBuildPlan').onclick = () => {
    const options = {};
    PLAN_OPTIONS.forEach(o => { options[o.id] = document.getElementById('plan_' + o.id).checked; });
    bridge.send('buildPlan', options);
  };
}

/* ============================================================ messages */

function wireBridge() {
  bridge.on('boot', payload => {
    state.host = Object.assign(state.host, payload);
    if (payload.language && CATALOGUE[payload.language]) LANG = payload.language;

    document.getElementById('capRoot').value = payload.sessionRoot || '';
    document.getElementById('ollamaEndpoint').value = payload.ollama || 'http://localhost:11434';

    document.getElementById('elevationChip').textContent =
      payload.elevated ? t('common.elevated') : t('common.not_elevated');
    document.getElementById('versionChip').textContent = payload.version || '';

    applyLanguage();
    state.pinnedView = !!payload.view;
    setView(payload.view || (state.session ? 'overview' : 'capture'));
  });

  bridge.on('session', payload => load(payload));

  bridge.on('sessions', payload => {
    state.sessions = payload.sessions || [];
    if (payload.root) state.host.sessionRoot = payload.root;
    renderSessions();
    renderNav();
  });

  bridge.on('picked', payload => {
    if (payload.purpose === 'target') {
      document.getElementById('capTarget').value = payload.path || '';
    } else if (payload.purpose === 'sessionRoot') {
      document.getElementById('capRoot').value = payload.path || '';
      state.host.sessionRoot = payload.path || '';
      requestSessions();
    } else if (payload.purpose === 'compare') {
      if (payload.path && !state.compare.inputs.includes(payload.path)) {
        state.compare.inputs.push(payload.path);
        renderCompare();
      }
    }
  });

  bridge.on('captureState', payload => {
    state.capture.state = payload.state || 'idle';
    state.capture.events = payload.events || 0;
    state.capture.elapsed = payload.elapsed || 0;
    renderCaptureLive();
    if (payload.message) toast(payload.message, payload.error ? 'error' : 'ok');
  });

  bridge.on('ai', payload => {
    state.ai.busy = !!payload.busy;
    if (payload.progress !== undefined) state.ai.progress = payload.progress;
    if (payload.status) state.ai.status = payload.status;
    if (payload.assessments) state.ai.assessments = payload.assessments;
    if (payload.report) state.ai.report = payload.report;
    renderAi();
    if (payload.report) renderFindings();
  });

  bridge.on('compare', payload => { state.compare.result = payload; renderCompare(); });
  bridge.on('plan', payload => { state.plan = payload; renderPlan(); });
  bridge.on('fleet', payload => { state.fleet = payload; renderFleet(); });

  bridge.on('toast', payload => toast(payload.text || '', payload.kind));

  bridge.on('modal', payload => {
    // Used for the confirmations the host must own — the HTTPS interception consent
    // in particular, which installs a trusted root and therefore needs a typed answer
    // rather than a click.
    const extra = el('div');
    let typed = null;

    if (payload.requireTyped) {
      extra.appendChild(el('div', 'hint', payload.typedPrompt || ''));
      typed = document.createElement('input');
      typed.type = 'text';
      typed.autocomplete = 'off';
      typed.style.marginTop = '8px';
      extra.appendChild(typed);
    }

    showModal({
      title: payload.title || '',
      body: payload.body || '',
      extra: payload.requireTyped ? extra : null,
      actions: [
        { label: payload.declineLabel || t('common.cancel'),
          onClick: () => bridge.send('modalResult', { id: payload.id, accepted: false }) },
        { label: payload.acceptLabel || t('common.yes'), className: 'btn-primary',
          onClick: () => {
            if (payload.requireTyped && (!typed || typed.value.trim() !== payload.requireTyped)) {
              toast(payload.typedPrompt || '', 'error');
              return false;
            }
            bridge.send('modalResult', { id: payload.id, accepted: true });
          } },
      ],
    });
  });
}

/* ================================================================ boot */

function boot() {
  document.querySelectorAll('.live-only').forEach(node => { node.hidden = !bridge.live; });
  if (bridge.live) document.body.classList.add('is-live');

  wire();
  wireBridge();

  if (window.__CAYATRACE_DATA__) {
    applyLanguage();
    load(window.__CAYATRACE_DATA__);
    setView('overview');
  } else if (bridge.live) {
    window.chrome.webview.addEventListener('message', e => {
      const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      bridge.receive(msg);
    });
    applyLanguage();
    bridge.send('ready', {});
  } else {
    applyLanguage();
    setView('overview');
  }
}

boot();
</script>
