  row.appendChild(sample);

  box.appendChild(row);
  return box;
}

function renderRemoteProcesses(a, processes) {
  const details = el('details', 'remote-procs');
  details.open = true;
  details.appendChild(el('summary', null, t('fleet.processes') + ' (' + processes.length + ')'));

  const tbl = el('table', 'kvtable');
  processes.slice(0, 400).forEach(pr => {
    const tr = el('tr');

    const name = el('td', 'kvname');
    name.appendChild(el('span', null, pr.name));
    name.appendChild(el('span', 'tl-pid', ' (' + pr.pid + ')'));
    if (pr.services) name.appendChild(el('div', 'kvwas', pr.services));
    tr.appendChild(name);

    const info = el('td', 'kvdata');
    if (pr.path) info.appendChild(el('code', 'wrap-any', pr.path));
    if (pr.commandLine) info.appendChild(el('div', 'kvwas', pr.commandLine));
    tr.appendChild(info);

    const act = el('td', 'nowrap');
    if (pr.critical) {
      act.appendChild(el('span', 'tag tag-warn', t('fleet.critical')));
    } else {
      const stop = el('button', 'btn btn-ghost btn-small', t('fleet.stop_process'));
      stop.type = 'button';
      stop.onclick = () => confirmThen('fleet.confirm_stop', () => bridge.send('fleetControl', {
        agent: a.id, action: 'stop', pid: pr.pid, name: pr.name,
      }));
      act.appendChild(stop);

      const tree = el('button', 'btn btn-ghost btn-small', t('fleet.stop_tree'));
      tree.type = 'button';
      tree.onclick = () => confirmThen('fleet.confirm_stop', () => bridge.send('fleetControl', {
        agent: a.id, action: 'stopTree', pid: pr.pid, name: pr.name,
      }));
      act.appendChild(tree);

      if (pr.services) {
        const svc = el('button', 'btn btn-ghost btn-small', t('fleet.stop_service'));
        svc.type = 'button';
        svc.onclick = () => confirmThen('fleet.confirm_stop', () => bridge.send('fleetControl', {
          agent: a.id, action: 'stopService', service: String(pr.services).split(',')[0].trim(),
        }));
        act.appendChild(svc);
      }
    }
    tr.appendChild(act);

    tbl.appendChild(tr);
  });

  details.appendChild(wrapScroll(tbl));
  return details;
}

/* =============================================================== export */

const EXPORT_FORMATS = ['html', 'json', 'csv', 'tree', 'package'];
const EXPORT_SCOPES = ['minimal', 'standard', 'full'];

function openExportDialog() {

  form.appendChild(formatSet);

  const scopeSet = el('div', 'choice-set');

    b.appendChild(el('span', 'dot'));

/*
 * An exported report can re-export itself, without an engine behind it.
 *
 * Every format offered here is one it can actually produce. It used to fall through to
 * JSON for anything that was not CSV, so choosing HTML or Text silently wrote a .json —
 * an export that quietly ignores what was asked for is worse than one that refuses.
 */
function exportLocally(format) {
  const data = window.__CAYATRACE_DATA__ || {};
  let text, mime, ext;

  if (format === 'csv') {
    text = toCsv(data); mime = 'text/csv'; ext = 'csv';
  } else if (format === 'tree') {
    text = toText(data); mime = 'text/plain'; ext = 'txt';
  } else if (format === 'html') {
    // A copy of this very document, which is already self-contained: the stylesheet is
    // inlined, the catalogue is inlined, and the session is inlined.
    text = '<!doctype html>\n' + document.documentElement.outerHTML;
    mime = 'text/html'; ext = 'html';
  } else {
    text = JSON.stringify(data, null, 2); mime = 'application/json'; ext = 'json';
  }

  download(text, mime, ext, data);
}

function download(text, mime, ext, data) {
  // The byte-order mark keeps Excel and Notepad from guessing the encoding wrong on a
  // report full of non-ASCII paths. HTML carries its own charset and does not need it.
  const parts = ext === 'html' ? [text] : ["﻿", text];

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(parts, { type: mime + ';charset=utf-8' }));
  a.download = baseName(data) + '.' + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/*
 * A file name for the report, without the subject's own extension.
 *
 * A session recorded from "Setup.exe" is named after it, so appending the format left
 * "Setup.exe.html" — and Windows hides the last known extension, so the save dialog
 * showed "Setup.exe" and the operator reasonably concluded it was writing an executable.
 */
function baseName(data) {
  const name = (data.session && (data.session.Name || data.session.name)) || 'cayatrace';
  return name.replace(/\.(exe|dll|msi|com|scr|bat|cmd|ps1)$/i, '');
}

function toCsv(data) {
  const cell = v => {
    let s = String(v ?? '');
    // A leading formula character turns a path into something a spreadsheet executes.
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };

  const rows = [['risk', 'score', 'category', 'action', 'target', 'target2', 'old', 'new', 'reasons']];
  (data.findings || []).forEach(f => rows.push([
    f.risk, f.score, f.category, f.action, f.target, f.target2, f.oldValue, f.newValue,
    (f.reasons || []).join(' | '),
  ]));

  return rows.map(r => r.map(cell).join(',')).join('\r\n');
}

/* The report as plain text, for pasting into a ticket or a mail. */
function toText(data) {
  const out = [];
  const session = data.session || {};
  const machine = p(session, 'Machine') || {};

  out.push('CaYaTrace — ' + (p(session, 'Name') || ''));
  out.push('  ' + (p(machine, 'MachineName') || '') + '  ' + (p(machine, 'OsBuild') || ''));
  out.push('  ' + formatDateTime(p(session, 'StartedAt')));
  out.push('');

  const persistence = data.persistence || [];
  out.push(t('persistence.title').toUpperCase() + '  (' + persistence.length + ')');
  if (!persistence.length) out.push('  ' + t('persistence.none'));
  persistence.forEach(r => {
    out.push('  [' + r.risk + '] ' + r.kind + '  ' + r.identity);
    if (r.command) out.push('      → ' + r.command);
    out.push('      ' + r.location);
    (r.traits || []).forEach(x => out.push('      · ' + x));
  });
  out.push('');

  const findings = data.findings || [];
  out.push(t('nav.findings').toUpperCase() + '  (' + findings.length + ')');
  findings.forEach(f => {
    out.push('  [' + f.risk + '] ' + f.action + '  ' + f.target + (f.target2 ? '::' + f.target2 : ''));
    (f.reasons || []).forEach(x => out.push('      · ' + x));
  });
  out.push('');

  const net = data.network || {};
  const conversations = net.conversations || [];
  if (conversations.length) {
    out.push(t('network.tab_conversations').toUpperCase() + '  (' + conversations.length + ')');
    conversations.forEach(c => {
      out.push('  ' + (c.scope || '') + '  ' + (c.protocol || '') + '  ' + c.peer
               + '  ' + (c.process || '') + '  ' + formatBytes(c.bytes || 0));
      if (c.summary) out.push('      ' + c.summary);
    });
  }

  return out.join('\r\n');
}

/* ================================================================ load */

function load(data) {
  state.session = data.session || null;
  state.roots = data.tree || [];
  state.findings = data.findings || [];
  state.counts = data.counts || {};
  state.totalObservations = data.totalObservations || 0;
  state.network = Object.assign({ requests: [], conversations: [], flows: [], dns: [], tls: [] }, data.network || {});

  // Open on a tab that has something in it. Landing on an empty HTTP table when the
  // evidence is in Connections makes the session look emptier than it is.
  const firstPopulated = NETWORK_TABS.find(tab => (state.network[tab.id] || []).length);
  if (firstPopulated) state.networkTab = firstPopulated.id;
  state.processes = data.processes || [];
  state.persistence = data.persistence || [];
  state.timeline = data.timeline || [];

  // A new session is a new conversation. Carrying answers about the previous one into
  // this view would be the most confusing possible kind of stale data.
  state.chat = { busy: false, turns: [] };
  state.plan = null;
  state.planBuilding = false;
  state.remediation = null;
  state.runStatus = {};
  state.runOrder = [];
  state.quarantine = null;

  state.expanded = new Set();
  // Process nodes start open; everything below stays collapsed so an installer that
  // touched 40,000 files does not render 40,000 rows before the analyst has looked.
  state.roots.forEach(r => state.expanded.add(p(r, 'Id')));

  if (data.language && CATALOGUE[data.language]) LANG = data.language;

  renderAll();

  // Landing on a section that was empty a moment ago is disorienting; landing on the
  // overview of the session that just loaded is not. A view chosen with --view is left
  // alone, because it was chosen.
  if (!state.pinnedView && (!bridge.live || state.view === 'capture' || state.view === 'sessions'))
    setView('overview');
}

/*
 * What was actually said on the wire, grouped by where the other end is.
 *
 * This is the only view that sees a program talking to a peer rather than to a server:
 * the HTTP stacks report what goes through them and the intercepting proxy reads what is
 * routed to it, and a program that opens its own socket and speaks its own protocol to
 * another machine is invisible to both.
 */
function renderConversations(host, rows) {
  const byScope = {};
  rows.forEach(r => {
    const scope = r.scope || 'Internet';
    (byScope[scope] = byScope[scope] || []).push(r);
  });

  const order = PEER_SCOPES.filter(s => byScope[s]).concat(
    Object.keys(byScope).filter(s => !PEER_SCOPES.includes(s)));

  order.forEach(scope => {
    const card = el('div', 'card');
    card.appendChild(el('h3', null, t('network.scope.' + scope) || scope));
    card.appendChild(el('div', 'hint', t('network.scope.' + scope + '_hint') || ''));

    byScope[scope].forEach(r => card.appendChild(renderConversation(r)));
    host.appendChild(card);
  });

  /*
   * Said rather than left to be inferred. Conversations between two processes on this
   * machine are recorded as connections and their contents are not, because the Windows
   * packet monitor observes network adapters and traffic that never leaves the machine
   * does not cross one. A reader who opens this looking for a program's chatter with its
   * own local helper would otherwise conclude there was none.
   */
  if (!byScope.Loopback && loopbackFlowCount()) {
    host.appendChild(el('div', 'hint', t('network.loopback_not_captured')));
  }
}

function loopbackFlowCount() {
  return (state.network.flows || []).filter(f =>
    String(f.remote || '').startsWith('127.') || String(f.remote || '').startsWith('[::1]')).length;
}

/*
 * Shows conversation contents.
 *
 * The text is set on a pre-formatted element and never inserted as markup: this came off
 * the wire and is under nobody's control. It goes in a dialog rather than inline so a
 * megabyte of protocol does not displace the list behind it.
 */
function showBody(content, bytes, present, truncated, isHex) {
  if (!present) { toast(t('network.body_not_exported')); return; }

  const pre = el('pre', 'body-view');
  pre.textContent = content || '';

  const extra = el('div');
  extra.appendChild(wrapScroll(pre));
  if (truncated || (content || '').length >= 4096) {
    extra.appendChild(el('div', 'hint', t('network.body_truncated')));
  }

  showModal({
    title: t('network.body_title', formatBytes(bytes)),
    body: isHex || /^[0-9a-f]{8}  /.test(content || '') ? t('network.body_binary') : '',
    extra,
    actions: [{ label: t('common.close') }],
  });
}

function renderConversation(r) {
  const box = el('div', 'convo');

  const head = el('div', 'convo-head');
  head.appendChild(el('span', 'tag', r.inbound ? t('network.inbound') : t('network.outbound')));
  head.appendChild(el('strong', null, r.name && r.name !== r.protocol ? r.name : r.peer));
  if (r.protocol) head.appendChild(el('span', 'convo-proto', r.protocol));
  if (r.process) head.appendChild(el('span', 'convo-proc', r.process + ' (' + r.pid + ')'));
  box.appendChild(head);

  const facts = [];
  facts.push(r.peer);
  if (r.peerProcess) facts.push('→ ' + r.peerProcess);
  if (r.localPort) facts.push(t('network.local_port') + ' ' + r.localPort);
  facts.push(formatBytes(r.bytes || 0));
  box.appendChild(el('div', 'convo-facts', facts.join(' · ')));

  if (r.summary) box.appendChild(el('code', 'wrap-any convo-summary', r.summary));
  if (r.truncated) box.appendChild(el('div', 'hint', t('network.body_truncated')));

  // A conversation between two processes on this machine is reported completely except
  // for what was said, and saying so is better than a reader assuming nothing was.
  if (r.contentsUnavailable) box.appendChild(el('div', 'hint', t('network.loopback_no_contents')));

  const actions = el('div', 'row tight wrap');
  actions.style.marginTop = '8px';

  [['sentBody', 'sentBytes', 'sentPreview', 'network.body_sent'],
   ['receivedBody', 'receivedBytes', 'receivedPreview', 'network.body_received']]
    .forEach(([hashField, sizeField, previewField, key]) => {
      if (!r[hashField] && !r[previewField]) return;

      const b = el('button', 'btn btn-ghost btn-small',
        t(key) + ' · ' + formatBytes(r[sizeField] || 0));
      b.type = 'button';

      // The live workbench fetches the whole body from the session; an exported report
      // has nothing to fetch from and shows the preview that travelled with it.
      b.onclick = bridge.live && r[hashField]
        ? () => bridge.send('readBody', { hash: r[hashField] })
        : () => showBody(r[previewField], r[sizeField] || 0, !!r[previewField]);

      if (!bridge.live && !r[previewField]) {
        b.disabled = true;
        b.title = t('network.body_not_exported');
      }

      actions.appendChild(b);
    });

  if (actions.childElementCount) box.appendChild(actions);
  return box;
}

/* ============================================================ persistence */

/*
 * The ways the subject arranged to run again, one card per mechanism.
 *
 * One card per mechanism rather than one per registry value, because "it installed a
 * service called X that runs Y as LocalSystem and restarts itself" is the sentence an
 * analyst needs, and eight rows of DWORDs is not that sentence.
 */
function renderPersistence() {
  const host = document.getElementById('persistenceBody');
  if (!host) return;
  host.innerHTML = '';

  if (!state.persistence.length) {
    host.appendChild(emptyState(t('persistence.none'), t('persistence.none_hint')));
    return;
  }

  state.persistence.forEach(record => {
    const card = el('div', 'card persist');

    const head = el('div', 'persist-head');
    head.appendChild(el('span', 'risk risk-' + String(record.risk || '').toLowerCase(),
      t('risk.' + String(record.risk || 'info').toLowerCase())));
    head.appendChild(el('span', 'persist-kind', t('persistence.kind.' + record.kind) || record.kind));
    if (record.isNew) head.appendChild(el('span', 'tag', t('persistence.new')));
    if (record.restartsItself) head.appendChild(el('span', 'tag tag-warn', t('persistence.restarts')));
    card.appendChild(head);

    const title = el('h3', 'persist-name');
    title.appendChild(el('span', null, record.identity));
    if (record.displayName && record.displayName !== record.identity) {
      title.appendChild(el('span', 'persist-display', ' · ' + record.displayName));
    }
    card.appendChild(title);

    if (record.command) card.appendChild(pathLine(t('persistence.runs'), record.command));
    card.appendChild(pathLine(t('persistence.at'), record.location));

    if (record.installedBy) {
      card.appendChild(kv(t('persistence.installed_by'), record.installedBy));
    }

    if ((record.traits || []).length) {
      const traits = el('ul', 'trait-list');
      record.traits.forEach(x => traits.appendChild(el('li', null, x)));
      card.appendChild(traits);
    }

    if ((record.reasons || []).length) {
      const reasons = el('ul', 'reason-list');
      record.reasons.forEach(x => reasons.appendChild(el('li', null, x)));
      card.appendChild(reasons);
    }

    if ((record.values || []).length) {
      const details = el('details', 'persist-values');
      details.appendChild(el('summary', null, t('persistence.values') + ' (' + record.values.length + ')'));

      const table = el('table', 'kvtable');
      record.values.forEach(v => {
        const row = el('tr');
        row.appendChild(el('td', 'kvname', v.name));
        const cell = el('td', 'kvdata');
        cell.appendChild(el('code', 'wrap-any', v.data == null ? '—' : String(v.data)));
        if (v.previous != null && v.previous !== v.data) {
          cell.appendChild(el('div', 'kvwas', t('persistence.was') + ' ' + v.previous));
        }
        row.appendChild(cell);
        table.appendChild(row);
      });

      details.appendChild(wrapScroll(table));
      card.appendChild(details);
    }

    host.appendChild(card);
  });
}

/*
 * A path, shown tokenised by default with the real one available.
 *
 * The token is what makes a finding portable between machines and it stays the default.
 * But an operator standing at the machine wants to know where the file actually is, and
 * making them expand %WINDIR% in their head is a small tax charged every single time.
 */
function pathLine(label, value) {
  const row = el('div', 'pathline');
  row.appendChild(el('span', 'pathlabel', label));

  const shown = state.showRealPaths ? expandTokens(value) : value;
  const code = el('code', 'wrap-any', shown);
  if (shown !== value) code.title = value;
  row.appendChild(code);

  return row;
}

/*
 * Expands %WINDIR% and friends using the map recorded with the session.
 *
 * From the session's own machine profile rather than from this machine: a report is
 * frequently read somewhere other than where it was recorded, and expanding a token
 * against the reader's machine would quietly produce a path that never existed.
 */
function expandTokens(value) {
  if (!value) return value;

  const folders = state.session ? (p(state.session, 'Machine') || {}) : {};
  const map = p(folders, 'KnownFolders') || {};

  let out = value;
  Object.keys(map).forEach(token => {
    if (!map[token]) return;
    if (out.toUpperCase().startsWith(token.toUpperCase())) {
      out = map[token] + out.slice(token.length);
    }
  });
  return out;
}

/* =============================================================== timeline */

/*
 * What ran, in order, with what each one touched.
 *
 * Deliberately silent about who terminated whom: Windows does not report it without a
 * kernel driver, and inventing an answer from coincidence in timing is the kind of
 * confident wrong attribution this tool refuses everywhere else.
 */
function renderTimeline() {
  const host = document.getElementById('timelineBody');
  if (!host) return;
  host.innerHTML = '';

  const q = state.timelineQuery.trim().toLowerCase();
  const rows = state.timeline.filter(e => {
    if (e.preExisting && !state.timelinePreExisting) return false;
    if (!q) return true;
    return (e.name || '').toLowerCase().includes(q)
        || (e.path || '').toLowerCase().includes(q)
        || (e.commandLine || '').toLowerCase().includes(q);
  });

  if (!rows.length) {
    host.appendChild(emptyState(t('timeline.none'), t('timeline.none_hint')));
    return;
  }

  rows.forEach(entry => {
    const row = el('div', 'tl-row');

    const when = el('div', 'tl-when');
    when.appendChild(el('div', 'tl-time', formatClock(entry.started)));
    when.appendChild(el('div', 'tl-life',
      entry.seconds == null ? t('timeline.running') : formatDuration(entry.seconds)));
    row.appendChild(when);

    const body = el('div', 'tl-body');
    body.style.paddingLeft = Math.min(entry.depth || 0, 6) * 14 + 'px';

    const head = el('div', 'tl-head');
    head.appendChild(el('strong', null, entry.name));
    head.appendChild(el('span', 'tl-pid', '(' + entry.pid + ')'));
    if (entry.elevated) head.appendChild(el('span', 'tag', t('timeline.elevated')));
    if (entry.signature === 'Unsigned') head.appendChild(el('span', 'tag tag-warn', t('timeline.unsigned')));
    body.appendChild(head);

    if (entry.path) body.appendChild(pathLine('', entry.path));
    if (entry.commandLine) body.appendChild(el('code', 'wrap-any tl-cmd', entry.commandLine));

    const counters = [];
    if (entry.children) counters.push(t('timeline.children') + ' ' + entry.children);
    if (entry.files) counters.push(t('timeline.files') + ' ' + formatNumber(entry.files));
    if (entry.registry) counters.push(t('timeline.registry') + ' ' + formatNumber(entry.registry));
    if (entry.connections) counters.push(t('timeline.connections') + ' ' + entry.connections);
    if (entry.modules) counters.push(t('timeline.modules') + ' ' + entry.modules);
    if (counters.length) body.appendChild(el('div', 'tl-counters', counters.join(' · ')));

    (entry.notes || []).forEach(note => body.appendChild(el('div', 'tl-note', note)));
    (entry.installed || []).forEach(x => body.appendChild(el('div', 'tl-note tl-persist', x)));

    row.appendChild(body);
    host.appendChild(row);
  });
}

function formatDuration(seconds) {
  if (seconds == null) return '';
  if (seconds < 1) return (seconds * 1000).toFixed(0) + ' ms';
  if (seconds < 90) return seconds.toFixed(1) + ' s';
  return (seconds / 60).toFixed(1) + ' min';
}

function formatClock(value) {
  if (!value) return '';
  const d = new Date(value);
  return isNaN(d) ? '' : d.toLocaleTimeString();
}

/* =================================================================== chat */

const CHAT_SUGGESTIONS = [
  'chat.q.persistence', 'chat.q.tree', 'chat.q.services', 'chat.q.tasks',
  'chat.q.network', 'chat.q.local', 'chat.q.listeners', 'chat.q.files',
  'chat.q.processes', 'chat.q.rank',
];

/*
 * The conversation, with what was measured kept visibly separate from what a model said.
 *
 * Both are shown when a model contributed. A reader has to be able to tell which sentence
 * came from the session and which came from a language model, because only one of them is
 * evidence — and the models people run locally are small enough that the distinction is
 * not academic.
 */
function renderChat() {
  const log = document.getElementById('chatLog');
  if (!log) return;

  log.innerHTML = '';

  if (!state.chat.turns.length) {
    log.appendChild(el('div', 'chat-empty', t('chat.empty')));
  }

  state.chat.turns.forEach(turn => {
    log.appendChild(el('div', 'chat-q', turn.question));

    const a = el('div', 'chat-a');

    if (turn.phrased) {
      a.appendChild(el('div', 'chat-phrased', turn.phrased));
      const measured = el('details', 'chat-measured');
      measured.appendChild(el('summary', null, t('chat.measured')));
      measured.appendChild(el('div', 'chat-answer', turn.answer));
      appendEvidence(measured, turn.evidence);
      a.appendChild(measured);
    } else {
      a.appendChild(el('div', 'chat-answer', turn.answer));
      appendEvidence(a, turn.evidence);
    }

    appendCommand(a, turn.command);
    appendWeb(a, turn.web);

    if (turn.note) a.appendChild(el('div', 'chat-note', turn.note));
    if (turn.model && turn.phrased) a.appendChild(el('div', 'chat-note', t('chat.by_model') + ' ' + turn.model));

    log.appendChild(a);
  });

  if (state.chat.busy) log.appendChild(el('div', 'chat-busy', t('chat.thinking')));
  log.scrollTop = log.scrollHeight;

  const chips = document.getElementById('chatSuggestions');
  if (chips && !chips.childElementCount) {
    CHAT_SUGGESTIONS.forEach(key => {
      const b = el('button', 'chip', t(key));
      b.type = 'button';
      b.onclick = () => askChat(t(key));
      chips.appendChild(b);
    });
  }

  // Ask becomes Stop while one is in flight. A local model can take the better part of a
  // minute, and waiting on one with no way out is the same as a hang from where the
  // operator sits.
  const send = document.getElementById('btnChatSend');
  const stop = document.getElementById('btnChatStop');
  if (send) send.hidden = state.chat.busy;
  if (stop) stop.hidden = !state.chat.busy;

  renderChatModels();
}

/*
 * Opens one HTTP exchange under its own row: the headers it carried, and the body.
 *
 * Under the row rather than in a dialog because the question is nearly always comparative
 * — which of these requests carried the machine name, which POST is the one with the
 * payload — and a dialog makes you close it before you can look at the next one.
 *
 * The body is fetched from the session when the workbench is live and read from the
 * preview that travelled with the report when it is not, the same way a conversation's
 * body works.
 */
function toggleExchange(tr, r) {
  const open = tr.nextElementSibling && tr.nextElementSibling.classList.contains('exchange-detail');
  if (open) { tr.nextElementSibling.remove(); return; }

  const row = document.createElement('tr');
  row.className = 'exchange-detail';

  const cell = document.createElement('td');
  cell.colSpan = 6;

  if (r.headers && r.headers.length) {
    const table = el('table', 'kvtable');
    r.headers.forEach(h => {
      const line = document.createElement('tr');
      line.appendChild(cell_(h.name, 'mono nowrap'));
      line.appendChild(cell_(h.value, 'mono wrap-any'));
      table.appendChild(line);
    });
    cell.appendChild(table);
  }

  if (r.bodyBytes) {
    const b = el('button', 'btn btn-ghost btn-small',
      t('network.body') + ' · ' + formatBytes(r.bodyBytes));
    b.type = 'button';
    b.onclick = e => {
      e.stopPropagation();
      if (bridge.live && r.bodyHash) bridge.send('readBody', { hash: r.bodyHash });
      else showBody(r.bodyPreview, r.bodyBytes, !!r.bodyPreview);
    };
    if (!bridge.live && !r.bodyPreview) {
      b.disabled = true;
      b.title = t('network.body_not_exported');
    }
    const actions = el('div', 'row tight');
    actions.style.marginTop = '8px';
    actions.appendChild(b);
    cell.appendChild(actions);
  } else {
    cell.appendChild(el('div', 'hint', t('network.no_body')));
  }

  row.appendChild(cell);
  tr.parentNode.insertBefore(row, tr.nextSibling);
}

function cell_(text, cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  td.textContent = text == null ? '' : String(text);
  return td;
}

/*
 * A command the operator can run, shown as something to run.
 *
 * Deliberately not folded into the sentence above it. A command is the one thing in a chat
 * reply that has consequences, and it is built from the session rather than written by the
 * model — so it is presented as its own object, with the reasoning next to it and a copy
 * button, rather than as text the model might have paraphrased.
 *
 * A refusal renders in the same place and looks the same, because "here is why this is not
 * safe to hand you" is the more important message of the two.
 */
function appendCommand(host, command) {
  if (!command) return;

  const box = el('div', command.refused ? 'command-box command-refused' : 'command-box');
  box.appendChild(el('div', 'command-subject', command.subject));

  if (!command.refused && (command.lines || []).length) {
    const pre = el('pre', 'command-lines', command.lines.join('\n'));
    box.appendChild(pre);

    const row = el('div', 'row tight');
    const copy = el('button', 'btn btn-ghost btn-small', t('chat.copy'));
    copy.type = 'button';
    copy.onclick = () => {
      navigator.clipboard.writeText(command.lines.join('\n'))
        .then(() => toast(t('chat.copied')))
        .catch(() => {});
    };
    row.appendChild(copy);
    box.appendChild(row);

    if (command.elevated) box.appendChild(el('div', 'chat-note', t('chat.needs_admin')));
  }

  box.appendChild(el('div', 'command-why', command.rationale));
  host.appendChild(box);
}

/*
 * What a web search said, marked as not being evidence.
 *
 * Everything else in a reply was measured on this machine. A search result is somebody's
 * claim about a name, and the two must not look alike — an operator acting on a forum post
 * should know that is what they are doing.
 */
function appendWeb(host, findings) {
  if (!findings || !findings.length) return;

  const box = el('div', 'web-box');
  box.appendChild(el('div', 'web-caption', t('chat.web_caption')));

  findings.forEach(f => {
    const row = el('div', 'web-result');
    row.appendChild(el('div', 'web-title', f.title));
    if (f.snippet) row.appendChild(el('div', 'web-snippet', f.snippet));
    row.appendChild(el('div', 'web-url', f.url));
    box.appendChild(row);
  });

  host.appendChild(box);
}

/*
 * The models this machine has, with "no model" first.
 *
 * First because it is the honest default: every answer is computed from the session and
 * works without one. A model changes the wording, and on a small local model it can
 * change it for the worse — so choosing none is a real choice, not a fallback.
 */
function renderChatModels() {
  const select = document.getElementById('chatModel');
  if (!select) return;

  const models = (state.ai.status && state.ai.status.models) || [];
  const signature = models.map(m => m.name || m).join('|');
  if (select.dataset.signature === signature) return;

  const previous = select.value;
  select.dataset.signature = signature;
  select.innerHTML = '';

  const none = document.createElement('option');
  none.value = '';
  none.textContent = t('chat.no_model');
  select.appendChild(none);

  models.forEach(m => {
    const name = m.name || m;
    const option = document.createElement('option');
    option.value = name;
    option.textContent = m.parameterSize ? `${name} · ${m.parameterSize}` : name;
    select.appendChild(option);
  });

  if (previous && [...select.options].some(o => o.value === previous)) select.value = previous;

  const note = document.getElementById('chatModelNote');
  if (note) note.textContent = models.length ? '' : t('chat.no_models_found');
}

function appendEvidence(host, evidence) {
  if (!evidence || !evidence.length) return;
  const pre = el('pre', 'chat-evidence wrap-any');
  pre.textContent = evidence.join('\n');
  host.appendChild(wrapScroll(pre));
}

function askChat(question) {
  if (!question || state.chat.busy) return;

  state.chat.busy = true;
  state.chat.turns.push({ question, answer: '', evidence: [] });
  renderChat();

  bridge.send('ask', {
    question,
    detail: (document.getElementById('chatDetail') || {}).value || 'brief',

    // The chat's own picker, not the analysis card's. An empty value means answer from
    // the session alone, which is a choice the operator can make deliberately.
    model: (document.getElementById('chatModel') || {}).value || '',
    endpoint: (document.getElementById('ollamaEndpoint') || {}).value || '',
  });
}

/* ========================================================== remediation */

/*
 * Where a removal has got to, while it is happening.
 *
 * It used to run with no indication at all. That matters beyond comfort: when something
 * fails partway through, "it failed after moving these eleven files" is a recoverable
 * situation and "it failed" is a guess.
 */
/*
 * Every item in the run, with what happened to it, updated as it happens.
 *
 * The list is in the order the operator approved rather than the order the runner works
 * in — services stop before their binaries and folders go after their contents, which is
 * correct and is not the order anybody is reading in. Rows that have not been reached yet
 * are shown waiting, so the length of the list is the size of the job rather than a
 * number that grows.
 */
function runBoard() {
  const order = state.runOrder || [];
  if (!order.length) return el('div');

  const plan = (state.plan && state.plan.items) || [];
  const byId = {};
  plan.forEach(i => { byId[i.id] = i; });

  const table = el('table', 'kvtable run-board');

  order.forEach(id => {
    const status = state.runStatus[id];
    const item = byId[id];

    const outcome = (status && status.outcome) || 'Waiting';
    const row = el('tr', 'run-row run-' + outcome.toLowerCase());

    row.appendChild(el('td', 'kvname', t('outcome.' + outcome.toLowerCase(), outcome)));

    const cell = el('td', 'kvdata');
    cell.appendChild(el('code', 'wrap-any',
      (status && status.target) || (item && item.target) || id));

    if (status && status.detail) cell.appendChild(el('div', 'kvwas', status.detail));
    row.appendChild(cell);

    table.appendChild(row);
  });

  return wrapScroll(table);
}

function renderRemediation() {
  const host = document.getElementById('remediationProgress');
  if (!host) return;
  host.innerHTML = '';

  const r = state.remediation;
  if (!r) return;

  const card = el('div', 'card');

  if (r.running) {
    card.appendChild(el('h3', null, t('remediate.running')));

    const bar = el('div', 'progress');
    const fill = el('div', 'progress-fill');
    fill.style.width = (r.percent || 0) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    card.appendChild(el('div', 'progress-label',
      r.preparation
        ? r.target
        : `${r.index || 0} / ${r.total || 0} · ${r.target || ''}`));

    if (r.detail) card.appendChild(el('div', 'hint', r.detail));

    card.appendChild(runBoard());
    host.appendChild(card);
    return;
  }

  if (!r.complete) return;

  card.appendChild(el('h3', null, t('remediate.result')));
  card.appendChild(el('div', 'summary-row',
    `${t('remediate.removed')} ${r.removed} · ${t('remediate.skipped')} ${r.skipped} · ${t('remediate.failed')} ${r.failed}`));

  card.appendChild(runBoard());

  /* Something is still in the way, and there is more that can be done about it. */
  if (r.retryable > 0) {
    const box = el('div', 'retry-box');
    box.appendChild(el('div', 'retry-what', t('remediate.retry_available', formatNumber(r.retryable))));
    box.appendChild(el('div', 'hint', t('remediate.retry_hint')));

    const button = el('button', 'btn btn-danger', t('remediate.retry'));
    button.type = 'button';
    button.onclick = () => confirmRetry();
    box.appendChild(button);

    card.appendChild(box);
  }

  if ((r.defences || []).length) {
    const box = el('div', 'defence-box');
    box.appendChild(el('h4', null, t('remediate.defences')));
    r.defences.forEach(d => {
      const line = el('div', d.disarmed ? 'defence' : 'defence defence-blocked');
      line.appendChild(el('div', 'defence-what', d.description));
      line.appendChild(el('div', 'defence-response', d.response));
      box.appendChild(line);
    });
    card.appendChild(box);
  }

  if ((r.blocked || []).length) {
    const box = el('div', 'defence-box defence-blocked');
    box.appendChild(el('h4', null, t('remediate.blocked')));
    r.blocked.forEach(x => box.appendChild(el('div', 'defence-what', x)));
    card.appendChild(box);
  }

  /* Anything the run dealt with that was not on the approved list — a package applied
     without a plan on screen, for instance — still has to be reported somewhere. */
  const unlisted = (r.items || []).filter(i => i.id == null);
  if (unlisted.length) {
    const details = el('details');
    details.appendChild(el('summary', null, t('remediate.item_log') + ' (' + unlisted.length + ')'));
    const table = el('table', 'kvtable');
    unlisted.forEach(i => {
      const row = el('tr');
      row.appendChild(el('td', 'kvname', t('outcome.' + String(i.outcome).toLowerCase())));
      const cell = el('td', 'kvdata');
      cell.appendChild(el('code', 'wrap-any', i.target + (i.value ? '::' + i.value : '')));
      if (i.detail) cell.appendChild(el('div', 'kvwas', i.detail));
      row.appendChild(cell);
      table.appendChild(row);
    });
    details.appendChild(wrapScroll(table));
    card.appendChild(details);
  }

  host.appendChild(card);
}

/*
 * What is being held, and the decision about it.
 *
 * Deleting is the only irreversible operation in this tool, so it is offered here — after
 * the operator can see exactly what is on the list — rather than as part of the removal.
 */
function renderQuarantine() {
  const host = document.getElementById('quarantineBody');
  if (!host) return;
  host.innerHTML = '';

  // Either source can be the current one: a removal that just finished reports what it
  // is holding, and a later listing reports it again. Both carry the folder, and the
  // buttons below need it — sending the disposition without one leaves the host guessing
  // from whatever plan happened to be loaded.
  const q = state.quarantine;
  const r = state.remediation;

  const held = (q && q.held) || (r && r.held) || [];
  const root = (q && q.root) || (r && r.root) || null;
  if (!held.length) return;

  const card = el('div', 'card');
  card.appendChild(el('h3', null, t('quarantine.title')));
  card.appendChild(el('div', 'hint', t('quarantine.hint')));

  const table = el('table', 'kvtable');
  held.forEach(item => {
    const row = el('tr');
    row.appendChild(el('td', 'kvname', item.directory ? t('quarantine.folder') : t('quarantine.file')));
    const cell = el('td', 'kvdata');
    cell.appendChild(el('code', 'wrap-any', item.original));
    if (!item.canRestore) cell.appendChild(el('div', 'kvwas', t('quarantine.occupied')));
    row.appendChild(cell);
    table.appendChild(row);
  });
  card.appendChild(wrapScroll(table));

  const actions = el('div', 'row tight wrap');
  actions.style.marginTop = '14px';

  const keep = el('button', 'btn btn-ghost', t('quarantine.keep'));
  keep.type = 'button';
  keep.onclick = () => bridge.send('quarantineApply', { disposition: 'keep', root });
  actions.appendChild(keep);

  const restore = el('button', 'btn btn-ghost', t('quarantine.restore'));
  restore.type = 'button';
  restore.onclick = () => confirmThen('quarantine.confirm_restore',
    () => bridge.send('quarantineApply', { disposition: 'restore', root }));
  actions.appendChild(restore);

  const del = el('button', 'btn btn-danger', t('quarantine.delete'));
  del.type = 'button';
  del.onclick = () => confirmThen('quarantine.confirm_delete',
    () => bridge.send('quarantineApply', { disposition: 'delete', root }));
  actions.appendChild(del);

  card.appendChild(actions);
  host.appendChild(card);
}

/* ============================================================ messages */

function wireBridge() {
  bridge.on('boot', payload => {
    state.host = Object.assign(state.host, payload);
    if (payload.language && CATALOGUE[payload.language]) LANG = payload.language;

    document.getElementById('capRoot').value = payload.sessionRoot || '';
    document.getElementById('ollamaEndpoint').value = payload.ollama || 'http://localhost:11434';

    document.getElementById('elevationChip').textContent =
      payload.elevated ? t('common.elevated') : t('common.not_elevated');
    document.getElementById('versionChip').textContent = payload.version || '';

    applyLanguage();
    state.pinnedView = !!payload.view;
    setView(payload.view || (state.session ? 'overview' : 'capture'));
  });

  bridge.on('session', payload => load(payload));

  bridge.on('sessions', payload => {
    state.sessions = payload.sessions || [];
    if (payload.root) state.host.sessionRoot = payload.root;
    renderSessions();
    renderNav();
  });

  bridge.on('picked', payload => {
    if (payload.purpose === 'target') {
      document.getElementById('capTarget').value = payload.path || '';
    } else if (payload.purpose === 'sessionRoot') {
      document.getElementById('capRoot').value = payload.path || '';
      state.host.sessionRoot = payload.path || '';
      requestSessions();
    } else if (payload.purpose === 'compare') {
      if (payload.path && !state.compare.inputs.includes(payload.path)) {
        state.compare.inputs.push(payload.path);
        renderCompare();
      }
    }
  });

  bridge.on('captureState', payload => {
    state.capture.state = payload.state || 'idle';
    state.capture.events = payload.events || 0;
    state.capture.elapsed = payload.elapsed || 0;
    renderCaptureLive();
    if (payload.message) toast(payload.message, payload.error ? 'error' : 'ok');
  });

  bridge.on('ai', payload => {
    state.ai.busy = !!payload.busy;
    if (payload.progress !== undefined) state.ai.progress = payload.progress;
    if (payload.status) state.ai.status = payload.status;
    if (payload.assessments) state.ai.assessments = payload.assessments;
    if (payload.report) state.ai.report = payload.report;
    renderAi();
    if (payload.report) renderFindings();
  });

  bridge.on('compare', payload => { state.compare.result = payload; renderCompare(); });
  bridge.on('plan', payload => {
    state.planBuilding = false;
    state.plan = payload;
    state.remediation = null;
  state.runStatus = {};
  state.runOrder = [];
    state.quarantine = null;
    renderPlanOptions();
    renderPlan();
    renderRemediation();
    renderQuarantine();
  });
  bridge.on('fleet', payload => { state.fleet = payload; renderFleet(); });

  bridge.on('body', payload =>
    showBody(payload.content, payload.bytes || 0, true, payload.truncated, payload.kind === 'hex'));

  bridge.on('fleetAgent', payload => {
    state.agent = Object.assign(state.agent, payload);
    renderFleet();
  });

  bridge.on('chat', payload => {
    if (payload.cleared) {
      // The host has forgotten the conversation; the transcript on screen has to go with
      // it, or the operator is looking at context the assistant no longer has.
      state.chat.turns = [];
      renderChat();
      return;
    }

    if (payload.webEnabled !== undefined) {
      const box = document.getElementById('chatWeb');
      if (box) box.checked = !!payload.webEnabled;
      return;
    }

    state.chat.busy = !!payload.busy;

    if (!payload.busy && payload.question !== undefined) {
      // The placeholder turn pushed when the question was sent, now filled in.
      const turn = state.chat.turns[state.chat.turns.length - 1];
      if (turn && !turn.answer) {
        Object.assign(turn, {
          answer: payload.answer || '',
          phrased: payload.phrased || null,
          evidence: payload.evidence || [],
          note: payload.note || null,
          model: payload.model || null,
          empty: !!payload.empty,
          command: payload.command || null,
          web: payload.web || [],
        });
      }
    }

    renderChat();
  });

  bridge.on('remediation', payload => {
    /* Progress arrives twice per item — once as it starts, once with its outcome — and
       the board keeps the latest of the two. Without the id it is a message about
       something, with it, it is a message about a row. */
    if (payload.id != null) {
      state.runStatus[payload.id] = {
        outcome: payload.outcome || 'Working',
        detail: payload.detail || '',
        target: payload.target,
        kind: payload.kind,
      };
    }

    /* The completed run carries every result at once, which is also the only place a
       row that never produced progress (refused before it started) shows up. */
    if (payload.items) {
      payload.items.forEach(i => {
        if (i.id != null) {
          state.runStatus[i.id] = {
            outcome: i.outcome, detail: i.detail, target: i.target, kind: i.kind,
            retryable: i.retryable,
          };
        }
      });
    }

    state.remediation = payload;
    renderRemediation();
    if (payload.held) renderQuarantine();
  });

  bridge.on('npcap', payload => {
    state.npcap = payload;
    renderNpcapNotice();
  });

  bridge.on('quarantine', payload => {
    state.quarantine = payload;
    renderQuarantine();
    if (payload.results) {
      const failed = (payload.results || []).filter(r => !r.succeeded);
      failed.forEach(r => toast(r.original + ': ' + r.message, 'error'));
    }
  });

  bridge.on('toast', payload => {
    if (state.planBuilding && payload.kind === 'error') {
      state.planBuilding = false;
      renderPlanOptions();
      renderPlan();
    }
    toast(payload.text || '', payload.kind);
  });

  bridge.on('modal', payload => {
    // Used for the confirmations the host must own — the HTTPS interception consent
    // in particular, which installs a trusted root and therefore needs a typed answer
    // rather than a click.
    const extra = el('div');
    let typed = null;

    if (payload.requireTyped) {
      extra.appendChild(el('div', 'hint', payload.typedPrompt || ''));
      typed = document.createElement('input');
      typed.type = 'text';
      typed.autocomplete = 'off';
      typed.style.marginTop = '8px';
      extra.appendChild(typed);
    }

    showModal({
      title: payload.title || '',
      body: payload.body || '',
      extra: payload.requireTyped ? extra : null,
      actions: [
        { label: payload.declineLabel || t('common.cancel'),
          onClick: () => bridge.send('modalResult', { id: payload.id, accepted: false }) },
        { label: payload.acceptLabel || t('common.yes'), className: 'btn-primary',
          onClick: () => {
            if (payload.requireTyped && (!typed || typed.value.trim() !== payload.requireTyped)) {
              toast(payload.typedPrompt || '', 'error');
              return false;
            }
            bridge.send('modalResult', { id: payload.id, accepted: true });
          } },
      ],
    });
  });
}

/* ================================================================ boot */

function boot() {
  document.querySelectorAll('.live-only').forEach(node => { node.hidden = !bridge.live; });
  if (bridge.live) document.body.classList.add('is-live');

  wire();
  wireBridge();

  if (window.__CAYATRACE_DATA__) {
    applyLanguage();
    load(window.__CAYATRACE_DATA__);
    setView('overview');
  } else if (bridge.live) {
    window.chrome.webview.addEventListener('message', e => {
      const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      bridge.receive(msg);
    });
    applyLanguage();
    bridge.send('ready', {});
  } else {
    applyLanguage();
    setView('overview');
  }
}

boot();
</script>
</body>
</html>
